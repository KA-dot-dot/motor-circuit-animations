<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>8.二部電動機自動交替運轉控制電路實習_動畫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 左欄主電路加狀態,右欄控制電路,最上方為操作列。窄螢幕改為上下排列。 */
:root{
  --bg:#f2f5f8; --panel:#ffffff; --ink:#18212d; --muted:#556172; --line:#d3dbe5;
  --wire:#3a3a3a; --dot:#111111; --lbl:#222222; --term:#cde8f5; --tint:#cde8f5;
  --on:#d8352a; --flow:#ee8a22; --accent:#1d5fa6; --onaccent:#ffffff;
  --bz:#ff9d2e;
  --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151b; --panel:#18202a; --ink:#e8edf3; --muted:#9aa7b8; --line:#2b3643;
    --wire:#b6c1ce; --dot:#e8edf3; --lbl:#e8edf3; --term:#2d5167; --tint:#26475a;
    --on:#ff5547; --flow:#ffb04d; --accent:#6aa9ee; --onaccent:#0c1218;
    --bz:#ffa63d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151b; --panel:#18202a; --ink:#e8edf3; --muted:#9aa7b8; --line:#2b3643;
  --wire:#b6c1ce; --dot:#e8edf3; --lbl:#e8edf3; --term:#2d5167; --tint:#26475a;
  --on:#ff5547; --flow:#ffb04d; --accent:#6aa9ee; --onaccent:#0c1218;
  --bz:#ffa63d; color-scheme:dark;
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
.wrap{max-width:1360px;margin:0 auto;padding-block:12px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.25rem;line-height:1.3;margin:0 0 4px;font-weight:700;text-wrap:balance}
.sub{margin:0 0 10px;color:var(--muted);font-size:.88rem;text-wrap:pretty}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.fig{padding:8px}
.side{display:grid;gap:16px;min-width:0}
.status{order:-1}
h2{font-size:.8rem;letter-spacing:.08em;margin:0 0 10px;color:var(--muted);font-weight:500}
.controls .row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer;min-height:40px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:focus-visible,.switch input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.switch{display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.hint{margin:10px 0 0;color:var(--muted);font-size:.85rem}
.chips{list-style:none;margin:0 0 12px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.chips li{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums;font-size:.85rem}
.chips i{width:11px;height:11px;border-radius:50%;background:var(--line);flex:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 25%,transparent)}
.chips li.on{border-color:var(--c)}
.chips li.on i{background:var(--c)}
.chips b{margin-left:auto;font-weight:500;color:var(--muted)}
.chips li.on b{color:var(--ink)}
.msg-title{font-weight:700;margin:0 0 4px}
.msg{margin:0;min-height:5.2em;font-size:.92rem}
.legend{margin-top:10px;padding:10px 6px 2px;border-top:1px solid var(--line)}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:6px 16px;font-size:.85rem}
.legend li{display:flex;gap:10px;align-items:center}
.legend svg{flex:none}
.tm{margin-top:10px}.tm label{display:flex;align-items:center;gap:6px}
.tm input{width:4.6em;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.tm input:disabled{opacity:.45}
.controls .row.tm{margin-top:10px}
#pausePill{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:5;background:var(--accent);color:var(--onaccent);padding:4px 14px;border-radius:999px;font-size:.85rem}

/* 圖面 */
#fig2{display:block;width:100%;max-width:440px;margin:0 auto 6px;height:auto;max-height:36vh}
#fig{display:block;width:100%;height:auto;max-height:80vh}
.lb{font:14px Arial,Helvetica,sans-serif;fill:var(--lbl)}
.lb.sm{font-size:13px}
.lb.big{font-size:16px}
.lb.tmr{font-size:12px;font-variant-numeric:tabular-nums}
.w{fill:none;stroke:var(--wire);stroke-width:1.5;stroke-linejoin:miter}
.w.hot{stroke:var(--flow);stroke-width:2.8;stroke-dasharray:7 5;animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.dot{fill:var(--dot)}
.term{fill:var(--term);stroke:var(--wire);stroke-width:1.5}
.pl{stroke:var(--wire);stroke-width:3}
.sl{stroke:var(--wire);stroke-width:2.2}
.ct .fillb,.ct .outb{display:none}
.ct.act .pl,.ct.act .sl{display:none}
.ct.act:not(.nc) .fillb{display:inline;fill:var(--on);stroke:none}
.ct.act.nc .outb{display:inline;fill:none;stroke:var(--on);stroke-width:2.6}
.ct.live .fillb{display:inline;fill:var(--on);stroke:none}
.ct.live .pl{display:none}
.ct.live .sl{stroke:var(--panel)}
.barl{stroke:var(--wire);stroke-width:3}
.lever{stroke:var(--wire);stroke-width:2.2}
.pb{cursor:pointer;outline:none;touch-action:none}
.pb .bar{transition:transform .1s}
.pb:not(.nc).pressed .bar{transform:translateX(-11.6px)}
.pb.nc.pressed .bar{transform:translateX(-10px)}
.pb.pressed .barl,.pb.pressed .lever{stroke:var(--on)}
.pb.pressed .lb{fill:var(--on);font-weight:700}
.pb .hit{fill:transparent}
.pb:hover .hit{fill:color-mix(in srgb,var(--accent) 14%,transparent)}
.pb:focus-visible .hit{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}
.fuse rect{fill:var(--tint);stroke:var(--wire);stroke-width:2.5}
.fuse line{stroke:var(--wire);stroke-width:1.8}
.coil .body,.lamp .body,.bz .body{fill:var(--tint);stroke:var(--wire);stroke-width:1.8;transition:fill .12s}
.coil text,.lamp text,.bz text{font:13px Arial,Helvetica,sans-serif;fill:var(--lbl);text-anchor:middle}
.coil.on .body{fill:var(--on)}
.coil.on text{fill:#fff;font-weight:700}
.lamp .halo{fill:var(--hc);opacity:0;transition:opacity .12s}
.lamp.on .halo{opacity:.4}
.lamp .ray{stroke:var(--wire);stroke-width:1.5;transition:stroke .12s}
.lamp.on .ray{stroke:var(--rc);stroke-width:2.6}
.lamp.on .body{fill:var(--lc)}
.lamp.on text{fill:var(--tc);font-weight:700}
.bz.on .body{fill:var(--bz)}
.bz .wave{fill:none;stroke:var(--bz);stroke-width:2.6;stroke-linecap:round;opacity:0}
.bz.on .wave{opacity:1}
.bz.on .wg{animation:shake .14s linear infinite}
@keyframes shake{50%{transform:translateX(2px)}}
.olbar{transform-origin:270px 567px;transition:transform .2s}
.olbar line{stroke:var(--wire);stroke-width:3}
.olbar line.x{stroke-width:2.2}
.olbar.tripped{transform:rotate(-35deg)}
.olbar.tripped line{stroke:var(--on)}
.w.live{stroke:var(--flow);stroke-width:2.2}
.blade{stroke:var(--wire);stroke-width:2.5;stroke-linecap:round}
.mech{stroke:var(--wire);stroke-width:1;stroke-dasharray:3 3}
.th,.tb{fill:var(--panel);stroke:var(--wire);stroke-width:1.5}
.th.tripped{stroke:var(--on);stroke-width:2.6}
.motor .body{fill:var(--tint);stroke:var(--wire);stroke-width:1.8}
.motor.run .body{stroke:var(--on);stroke-width:2.8}
.motor .rot line{stroke:#4a86d8;stroke-width:6;stroke-linecap:round}
.motor.run .rot{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.motor .mt{font:700 13px Arial,Helvetica,sans-serif;fill:var(--lbl);text-anchor:middle;paint-order:stroke;stroke:var(--tint);stroke-width:3px}
.tk .tbar{transition:transform .1s}.tk .tbar line{stroke:var(--wire);stroke-width:3}
.tk .tbar polygon{fill:var(--panel);stroke:var(--wire);stroke-width:1.8}
.tk:not(.nc).act .tbar{transform:translateX(-7px)}.tk.nc.act .tbar{transform:translateX(7px)}
.tk.act .tbar line,.tk.act .tbar polygon,.tk.live .tbar line,.tk.live .tbar polygon{stroke:var(--on)}
.tk:not(.nc).act .tbar polygon,.tk.live .tbar polygon{fill:var(--on)}
body.paused .w.hot,body.paused .bz.on .wg,body.paused .motor.run .rot{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){
  .motor.run .rot{animation:none}
  .w.hot{animation:none;stroke-dasharray:none}
  .bz.on .wg{animation:none}
  .pb .bar,.olbar,.tk .tbar{transition:none}
}
@media (max-width:700px){.fc{overflow-x:auto}#fig{min-width:680px;max-height:none}}
@media (min-width:960px){
.stage{gap:12px;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);grid-template-areas:"ctrl ctrl" "main fig" "stat fig"}
.stage .side{display:contents}
.fm{grid-area:main}.fc{grid-area:fig}.controls{grid-area:ctrl}.status{grid-area:stat;order:0}.legend ul{grid-template-columns:repeat(2,minmax(0,1fr))}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px}
.controls h2{display:none}
.controls .switch,.controls .row.tm{margin:0}
.controls .hint{margin:0;flex:1 1 260px;font-size:.8rem}
}
</style>
<style>:root{color-scheme:light}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}[hidden]{display:none!important}</style>
</head>
<body>

<div id="pausePill" hidden>已暫停</div>
<main class="wrap">
  <h1 id="h1">二部電動機自動交替運轉控制電路</h1>
  <p class="sub" id="sub">按 PB1 啟動,M1 與 M2 交替運轉;按 PB2 停止。按住按鈕、放開彈回;鍵盤 a 是 PB1、s 是 PB2、空白鍵暫停。通電的元件變紅。</p>

  <div class="stage">
    <div class="card fig fm">
      <h2>主電路</h2>
      <svg id="fig2" viewBox="0 18 430 318" role="img" aria-label="主電路:NFB、MC1 與 MC2 主接點、積熱電驛 TH-RY1 與 TH-RY2、馬達 M1 與 M2"></svg>
    </div>
    <div class="card fig fc">
      <h2>控制電路</h2>
      <svg id="fig" viewBox="0 24 920 616" role="img" aria-label="自動交替運轉控制電路圖,含 PB1、PB2、X、TR1、TR2、MC1、MC2、RL、GL、BZ 與 OL">
        <g id="wires"></g>
        <g id="dots"></g>
        <g id="parts"></g>
        <g id="labels"></g>
      </svg>
      <section class="legend" aria-label="圖例">
        <h2>圖例</h2>
        <ul>
          <li><svg width="34" height="16" aria-hidden="true"><circle cx="17" cy="8" r="7" fill="var(--on)"/></svg><span>紅色圓圈:線圈通電;紅色按鈕:被按下</span></li>
          <li><svg width="34" height="16" aria-hidden="true"><rect x="3" y="2" width="28" height="12" fill="var(--on)"/></svg><span>紅色塗滿:接通並有電流通過的接點</span></li>
          <li><svg width="34" height="16" aria-hidden="true"><rect x="4" y="3" width="26" height="10" fill="none" stroke="var(--on)" stroke-width="2.6"/></svg><span>紅色外框:動作後打開的接點,斜線消失</span></li>
          <li><svg width="34" height="16" aria-hidden="true"><line x1="3" y1="8" x2="31" y2="8" stroke="var(--flow)" stroke-width="2.8" stroke-dasharray="7 5"/></svg><span>橘色流動線:電流經過的路徑</span></li>
        </ul>
      </section>
    </div>

    <aside class="side">
      <section class="card controls" aria-label="操作">
        <h2>操作</h2>
        <div class="row">
          <button class="btn" id="btnPause" type="button" aria-pressed="false">暫停(空白鍵)</button>
          <button class="btn" id="btnPower" type="button" aria-pressed="true">送電中</button>
          <button class="btn" id="btnTrip" type="button">模擬 OL 跳脫</button>
          <button class="btn" id="btnResetOL" type="button" disabled>OL 復歸</button>
          <button class="btn" id="btnReset" type="button">全部重設</button>
          <button class="btn" id="btnSnd" type="button" aria-pressed="true">聲音:開</button>
        </div>
        <div class="row tm"><label for="sTR1">TR1 <input type="number" id="sTR1" min="1" max="10" step="0.5" value="3"> 秒</label>
        <label for="sTR2">TR2 <input type="number" id="sTR2" min="1" max="10" step="0.5" value="3"> 秒</label></div>
        <label class="switch" for="chkFlow"><input type="checkbox" id="chkFlow"><span>顯示電流路徑</span></label>
      </section>

      <section class="card status" aria-label="目前狀態">
        <h2>目前狀態</h2>
        <ul class="chips" id="chips"></ul>
        <div aria-live="polite">
          <p class="msg-title" id="msgTitle"></p>
          <p class="msg" id="msgBody"></p>
        </div>
      </section>

    </aside>
  </div>
</main>

<script>
(function(){
'use strict';
function $(id){return document.getElementById(id);}
var NS='http://www.w3.org/2000/svg';
var svg=$('fig'),svg2=$('fig2');
var gW=svg.querySelector('#wires'),gD=svg.querySelector('#dots'),gP=svg.querySelector('#parts'),gL=svg.querySelector('#labels');

/* ---- 狀態 ---- */
var st={power:true,tripped:false,flow:false,
  p:{PB1:false,PB2:false},
  c:{X:false,MC1:false,MC2:false,TR1:false,TR2:false},   // 線圈通電
  d:{TR1:false,TR2:false},                                // 限時接點是否動作(計時完成)
  t:{TR1:0,TR2:0}};                                       // 已計時秒數(遞增)
var setSec={TR1:3,TR2:3};                                 // 設定秒數,全部重設時保留
var edges=[],loads=[],acts=[],pbEls=[],coilEls={},lampEls={},bzEl=null,olbar=null,tms={};

/* ---- 繪圖輔助 ---- */
function el(tag,attrs,parent){
  var e=document.createElementNS(NS,tag);
  for(var k in attrs){e.setAttribute(k,attrs[k]);}
  if(parent){parent.appendChild(e);}
  return e;
}
function txt(x,y,s,cls,anchor){
  var t=el('text',{x:x,y:y,'class':cls||'lb'},gL);
  if(anchor){t.setAttribute('text-anchor',anchor);}
  t.textContent=s;
  return t;
}
function wire(a,b,d){var p=el('path',{d:d,'class':'w'},gW);edges.push({a:a,b:b,el:p,on:function(){return true;}});}
function swi(a,b,fn){edges.push({a:a,b:b,on:fn});}
function load(a,b,key){loads.push({a:a,b:b,key:key});}
function dot(x,y){el('circle',{cx:x,cy:y,r:3.5,'class':'dot'},gD);}
function term(x,y){el('circle',{cx:x,cy:y,r:5,'class':'term'},gP);}

/* MC 接點:兩片橫板,NC 加斜線 */
function contact(cx,y1,y2,hw,o){
  var g=el('g',{'class':'ct'+(o.slash?' nc':'')},gP);
  el('rect',{x:cx-hw,y:y1-1.5,width:2*hw,height:(y2-y1)+3,'class':'fillb'},g);
  el('rect',{x:cx-hw,y:y1,width:2*hw,height:(y2-y1),'class':'outb'},g);
  el('line',{x1:cx-hw,y1:y1,x2:cx+hw,y2:y1,'class':'pl'},g);
  el('line',{x1:cx-hw,y1:y2,x2:cx+hw,y2:y2,'class':'pl'},g);
  if(o.slash){el('line',{x1:o.slash[0],y1:o.slash[1],x2:o.slash[2],y2:o.slash[3],'class':'sl'},g);}
  acts.push([g,o.test,o.live]);
  txt(o.lx,o.ly,o.label,'lb',o.la||'start');
}
/* 以接點中點 mid 為基準:板距 15,板寬 ±16,標籤在右側與接點同高 */
function ct(cx,mid,label,nc,test,live){
  var y1=mid-7.5,y2=mid+7.5;
  contact(cx,y1,y2,16,{label:label,lx:cx+22,ly:mid+5,test:test,live:live,
    slash:nc?[cx-10,y2+4,cx+10,y1-4]:null});
}

/* 按鈕:NO 豎線在右側留空隙,NC 豎線貼著圓圈 */
function button(name,c,o){
  var g=el('g',{'class':'pb'+(o.nc?' nc':''),'data-pb':name,tabindex:'0',role:'button','aria-label':name+' 按鈕,按住時按下'},gP);
  el('rect',{x:c-12,y:o.hy,width:66,height:o.hh,rx:6,'class':'hit'},g);
  el('circle',{cx:c,cy:o.yt,r:o.r||5,'class':'term'},g);
  el('circle',{cx:c,cy:o.yb,r:o.r||5,'class':'term'},g);
  var bar=el('g',{'class':'bar'},g);
  el('line',{x1:o.bx,y1:o.by1,x2:o.bx,y2:o.by2,'class':'barl'},bar);
  el('line',{x1:o.bx,y1:o.ly,x2:o.lx,y2:o.ly,'class':'lever'},bar);
  var t=el('text',{x:o.tx,y:o.ty,'class':'lb'},g);
  t.textContent=name;
  pbEls.push(g);
}
function pb(name,c,yt,yb,nc){
  var m=(yt+yb)/2;
  button(name,c,{r:5,nc:nc,yt:yt,yb:yb,bx:nc?c-5:c+11,by1:yt-8,by2:yb+8,ly:m,lx:nc?c+10:c+26,
    tx:c+17,ty:nc?m+5:m-8,hy:yt-16,hh:(yb-yt)+32});
}

/* 限時接點:兩個端子圓圈 + 動作桿 + 三角形(通電延遲,尖端朝右)。nc=true 為 b 接點(桿貼圓圈) */
function tcontact(cx,yt,yb,nc,label,test,live){
  var g=el('g',{'class':'tk'+(nc?' nc':'')},gP),m=(yt+yb)/2,bx=cx+(nc?5:11);
  el('circle',{cx:cx,cy:yt,r:5,'class':'term'},g);el('circle',{cx:cx,cy:yb,r:5,'class':'term'},g);
  var b=el('g',{'class':'tbar'},g);
  el('line',{x1:bx,y1:yt-8,x2:bx,y2:yb+8},b);
  el('polygon',{points:bx+','+(m-9)+' '+bx+','+(m+9)+' '+(bx+14)+','+m},b);
  acts.push([g,test,live]);txt(cx+28,m+5,label);
}

function coil(key,cx,cy,rr){
  var g=el('g',{'class':'coil'},gP);
  el('circle',{cx:cx,cy:cy,r:rr||18,'class':'body'},g);
  var t=el('text',{x:cx,y:cy+4.6},g);t.textContent=key;
  coilEls[key]=g;
}
function lamp(key,cx,cy,c){
  var g=el('g',{'class':'lamp',style:'--lc:'+c.lc+';--rc:'+c.rc+';--hc:'+c.hc+';--tc:'+c.tc},gP);
  el('circle',{cx:cx,cy:cy,r:27,'class':'halo'},g);
  [45,135,225,315].forEach(function(a){
    var r=a*Math.PI/180,cs=Math.cos(r),sn=Math.sin(r);
    el('line',{x1:cx+21*cs,y1:cy+21*sn,x2:cx+31*cs,y2:cy+31*sn,'class':'ray'},g);
  });
  el('circle',{cx:cx,cy:cy,r:18,'class':'body'},g);
  var t=el('text',{x:cx,y:cy+4.6},g);t.textContent=key;
  lampEls[key]=g;
}
function buzzer(cx,cy){
  var g=el('g',{'class':'bz'},gP);
  var wg=el('g',{'class':'wg'},g);
  ['M170 410Q164 420 170 430','M163 403Q153 420 163 437','M156 396Q142 420 156 444'].forEach(function(d){el('path',{d:d,'class':'wave'},wg);});
  el('circle',{cx:cx,cy:cy,r:18,'class':'body'},g);
  var t=el('text',{x:cx,y:cy+4.6},g);t.textContent='BZ';
  bzEl=g;
}
function fuse(x,y,label){
  var fz=el('g',{'class':'fuse'},gP);
  el('rect',{x:x,y:y-10,width:38,height:20},fz);

/* ---- 電路求解:R、T 兩側各自沿導通路徑延伸,負載兩端分屬兩側即通電 ---- */
function solve(){
  var adj={},i,e;
  for(i=0;i<edges.length;i++){
    e=edges[i];
    if(!e.on()){continue;}
    (adj[e.a]=adj[e.a]||[]).push([e.b,e]);
    (adj[e.b]=adj[e.b]||[]).push([e.a,e]);
  }
  function reach(seed){
    var s={},q=[seed];s[seed]=true;
    while(q.length){
      var n=q.pop(),l=adj[n]||[];
      for(var j=0;j<l.length;j++){if(!s[l[j][0]]){s[l[j][0]]=true;q.push(l[j][0]);}}
    }
    return s;
  }
  var rnet=st.power?reach('R0'):{};
  var tnet=reach('T0');
  var on={},hot=new Set();
  function paths(from,to){
    var seen={},stack=[];seen[from]=true;
    (function dfs(n){
      if(n===to){stack.forEach(function(x){hot.add(x);});return;}
      var l=adj[n]||[];
      for(var j=0;j<l.length;j++){
        var m=l[j][0];
        if(seen[m]){continue;}
        seen[m]=true;stack.push(l[j][1]);dfs(m);stack.pop();seen[m]=false;
      }
    })(from);
  }
  loads.forEach(function(L){
    var f=false,ra=null,tb=null;
    if(rnet[L.a]&&tnet[L.b]){f=true;ra=L.a;tb=L.b;}
    else if(rnet[L.b]&&tnet[L.a]){f=true;ra=L.b;tb=L.a;}
    on[L.key]=f;
    if(f&&st.flow){paths('R0',ra);paths(tb,'T0');}
  });
  return {on:on,hot:hot,rnet:rnet};
}

/* ---- 逐級更新與計時(暫停時只重繪) ---- */
var timer=0,busy=false,paused=false,relPend={};
function settle(){
  clearTimeout(timer);busy=false;
  if(paused){render(solve());return;}
  var r=solve(),ch=false,nn=0;
  Object.keys(st.c).forEach(function(k){var v=!!r.on[k];if(v!==st.c[k]){st.c[k]=v;ch=true;sfxCoil(k,v,(nn++)*.012);}});
  ['TR1','TR2'].forEach(function(k){if(!st.c[k]){if(st.d[k]){st.d[k]=false;ch=true;}st.t[k]=0;}});
  if(ch){r=solve();}
  render(r);
  if(ch){busy=true;timer=setTimeout(settle,170);}
}
/* 每 100 ms 累加計時(遞增);暫停時跳過;逐級更新進行中只重繪,不打斷 170 ms 節奏 */
setInterval(function(){
  if(paused){return;}var a=false;
  ['TR1','TR2'].forEach(function(k){if(st.c[k]&&!st.d[k]){a=true;st.t[k]+=0.1;if(st.t[k]>=setSec[k]-1e-6){st.t[k]=setSec[k];st.d[k]=true;}}});
  if(a){if(busy){render(solve());}else{settle();}}
},100);

function release(n){down[n]=false;if(paused){relPend[n]=true;return;}var w=Math.max(0,260-(performance.now()-(downAt[n]||0)));clearTimeout(relT[n]);relT[n]=setTimeout(function(){if(!down[n]){st.p[n]=false;sfxBtn(false);settle();}},w);}
function bindPB(){pbEls.forEach(function(g){
  var n=g.getAttribute('data-pb');
  g.addEventListener('pointerdown',function(e){
    e.preventDefault();
    try{g.setPointerCapture(e.pointerId);}catch(x){}
    press(n);
  });
  ['pointerup','pointercancel'].forEach(function(t){g.addEventListener(t,function(){release(n);});});
  g.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.repeat){e.preventDefault();press(n);}
  });
  g.addEventListener('keyup',function(e){
    if(e.key==='Enter'){release(n);}
  });
});}
var KEYS={a:'PB1',s:'PB2'};
function typing(e){var t=e.target&&e.target.tagName;return t==='INPUT'||t==='SELECT';}
document.addEventListener('keydown',function(e){
  if(e.key===' '&&!typing(e)){e.preventDefault();if(!e.repeat){setPaused(!paused);}return;}
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat){return;}
  var n=KEYS[e.key.toLowerCase()];if(n){press(n);}
});
document.addEventListener('keyup',function(e){
  if(e.key===' '&&!typing(e)){e.preventDefault();return;}
  var n=KEYS[e.key.toLowerCase()];if(n){release(n);}
});
window.addEventListener('blur',function(){Object.keys(down).forEach(function(n){if(down[n]){release(n);}});});

function setPaused(v){
  paused=v;document.body.classList.toggle('paused',v);$('pausePill').hidden=!v;
  $('btnPause').textContent=v?'繼續(空白鍵)':'暫停(空白鍵)';$('btnPause').setAttribute('aria-pressed',v?'true':'false');
  if(AC){if(v){AC.suspend();}else if(!document.hidden){AC.resume();}}
  if(!v){Object.keys(relPend).forEach(function(n){delete relPend[n];release(n);});}
  syncBuzz();settle();
}
$('btnPause').addEventListener('click',function(){setPaused(!paused);});
$('btnPower').addEventListener('click',function(){sfxSel();st.power=!st.power;settle();});
$('btnTrip').addEventListener('click',function(){if(st.power){sfxSel();st.tripped=true;settle();}});
$('btnResetOL').addEventListener('click',function(){sfxSel();st.tripped=false;settle();});
$('btnReset').addEventListener('click',function(){
  setPaused(false);
  st.power=true;st.tripped=false;
  Object.keys(st.c).forEach(function(k){st.c[k]=false;});
  ['TR1','TR2'].forEach(function(k){st.d[k]=false;st.t[k]=0;});
  Object.keys(st.p).forEach(function(k){st.p[k]=false;down[k]=false;});
  settle();
});
$('chkFlow').addEventListener('change',function(e){st.flow=e.target.checked;settle();});

/* 秒數輸入:1~10,每次 0.5,自動修正 */
['TR1','TR2'].forEach(function(k){var i=$('s'+k);i.addEventListener('change',function(){
  var v=parseFloat(i.value);if(!isFinite(v)){v=3;}
  v=Math.min(10,Math.max(1,Math.round(v*2)/2));i.value=v;setSec[k]=v;settle();
});});

/* ---- 聲音(Web Audio 即時合成,第一次操作後才會發聲) ---- */
var AC=null,snd=true,master=null,wantBuzz=false,buzz=null;
function unlockAudio(){
  if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C){return;}AC=new C();
    var cp=AC.createDynamicsCompressor();master=AC.createGain();master.gain.value=.9;master.connect(cp);cp.connect(AC.destination);}
  if(AC.state!=='running'&&!paused&&!document.hidden){AC.resume();}
}
function tone(f,d,ty,g,t0,f2){
  if(!AC||!snd||paused){return;}
  var t=AC.currentTime+(t0||0),o=AC.createOscillator(),v=AC.createGain();
  o.type=ty;o.frequency.setValueAtTime(f,t);if(f2){o.frequency.exponentialRampToValueAtTime(f2,t+d);}
  v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(master);o.start(t);o.stop(t+d+.02);
}
function noise(d,g,fc,t0){
  if(!AC||!snd||paused){return;}
  var n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0),i;
  for(i=0;i<n;i++){a[i]=Math.random()*2-1;}
  var s=AC.createBufferSource(),f=AC.createBiquadFilter(),v=AC.createGain(),t=AC.currentTime+(t0||0);
  s.buffer=b;f.type='bandpass';f.frequency.value=fc;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(v);v.connect(master);s.start(t);
}
function sfxBtn(dn){noise(.03,dn?.5:.25,3000);tone(dn?1200:900,.04,'square',dn?.12:.06,0,400);}
function sfxSel(){tone(220,.09,'triangle',.3,0,110);noise(.04,.3,800);}
function sfxMC(on,k,dl){var p=[1,.88][k]*(1+(Math.random()-.5)*.04),g=on?1:.5;
  noise(.03,.7*g,2500*p,dl);tone((on?140:110)*p,on?.14:.08,'sine',.6*g,dl,60*p);tone(900*p,.03,'square',.15*g,dl);if(on){noise(.06,.3,600*p,dl+.05);}}
function sfxRelay(on,dl){var g=on?1:.5;noise(.02,.35*g,4500,dl);tone(1800,.025,'square',.08*g,dl);}
function sfxCoil(k,on,dl){       // 限時電驛線圈不發聲
  if(k==='MC1'){sfxMC(on,0,dl);}else if(k==='MC2'){sfxMC(on,1,dl);}else if(k==='X'){sfxRelay(on,dl);}
}
function syncBuzz(){
  var want=wantBuzz&&snd&&!paused&&!!AC;
  if(want&&!buzz){var o=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain();
    o.type='square';o.frequency.value=2700;lp.type='lowpass';lp.frequency.value=5000;g.gain.value=0;
    o.connect(lp);lp.connect(g);g.connect(master);o.start();g.gain.setTargetAtTime(.07,AC.currentTime,.02);buzz={o:o,g:g};}
  else if(!want&&buzz){var b=buzz;buzz=null;b.g.gain.setTargetAtTime(0,AC.currentTime,.04);b.o.stop(AC.currentTime+.25);}
}
$('btnSnd').addEventListener('click',function(){
  snd=!snd;this.setAttribute('aria-pressed',snd?'true':'false');this.textContent=snd?'聲音:開':'聲音:關';
  if(snd){unlockAudio();sfxMC(true,0,0);}syncBuzz();
});
document.addEventListener('pointerdown',unlockAudio,true);document.addEventListener('keydown',unlockAudio,true);
/* iOS 音效修正:①手機靜音鍵會讓 Web Audio 無聲,改播一段靜音 audio 元素讓系統走「播放」類別;②iOS 只認 touchend/click 當解鎖手勢 */
function iosAudioFix(getCtx){
  try{if(navigator.audioSession){navigator.audioSession.type='playback';}}catch(e){}
  var el=null;
  function silentWav(){
    var n=4000,b=new ArrayBuffer(44+n*2),v=new DataView(b);
    function s(o,t){for(var i=0;i<t.length;i++){v.setUint8(o+i,t.charCodeAt(i));}}
    s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*2,true);
    return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
  }
  function go(){
    var c=getCtx();
    if(c){try{var s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0);}catch(e){}}
    if(!el){try{el=document.createElement('audio');el.src=silentWav();el.loop=true;el.setAttribute('playsinline','');}catch(e){el=null;return;}}
    if(el.paused){var p=el.play();if(p&&p.catch){p.catch(function(){});}}
  }
  ['touchend','pointerup','click'].forEach(function(t){document.addEventListener(t,function(){unlockAudio();go();},true);});
  document.addEventListener('visibilitychange',function(){if(!el){return;}if(document.hidden){el.pause();}else{go();}});
}
iosAudioFix(function(){return AC;});
document.addEventListener('visibilitychange',function(){if(!AC){return;}if(document.hidden){AC.suspend();}else if(!paused){AC.resume();}});

/* ---- 啟動 ---- */
buildMain();buildControl();bindPB();buildChips();settle();
})();
