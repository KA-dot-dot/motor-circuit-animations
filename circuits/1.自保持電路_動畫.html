<style>

.lb{font:14px Arial,Helvetica,sans-serif;fill:var(--lbl)}.lb.big{font-size:16px}.lb.t{font-size:15px;font-weight:700}
.w{fill:none;stroke:var(--wire);stroke-width:1.5}
.w.hot{stroke:var(--flow);stroke-width:2.8;stroke-dasharray:7 5;animation:flow .7s linear infinite}@keyframes flow{to{stroke-dashoffset:-12}}
.w.live{stroke:var(--flow);stroke-width:2.2}
.dot{fill:var(--dot)}.term{fill:var(--term);stroke:var(--wire);stroke-width:1.5}

.ct .fillb,.ct .outb{display:none}.ct.act .pl,.ct.act .sl{display:none}

.barl{stroke:var(--wire);stroke-width:3}.lever{stroke:var(--wire);stroke-width:2.2}

.pb:not(.nc).pressed .bar{transform:translateX(-11px)}.pb.nc.pressed .bar{transform:translateX(-10px)}
.pb.pressed .barl,.pb.pressed .lever{stroke:var(--on)}.pb.pressed .lb{fill:var(--on);font-weight:700}
.pb .hit{fill:transparent}@media (hover:hover){.pb:hover .hit{fill:var(--accent);fill-opacity:.14}}.pb:focus-visible .hit{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}

.coil.bz.on .body{fill:var(--bz)}.coil.bz .wave{fill:none;stroke:var(--bz);stroke-width:2.6;stroke-linecap:round;opacity:0}.coil.bz.on .wave{opacity:1}.coil.bz.on .wg{animation:shake .14s linear infinite}@keyframes shake{50%{transform:translateX(2px)}}
.lamp .halo{fill:var(--hc);opacity:0;transition:opacity .12s}.lamp.on .halo{opacity:.4}

.th{fill:var(--panel);stroke:var(--wire);stroke-width:1.5}.th.tripped{stroke:var(--on);stroke-width:2.6}
.motor .body{fill:var(--tint);stroke:var(--wire);stroke-width:1.8}.motor.run .body{stroke:var(--on);stroke-width:2.8}
.motor .rot line{stroke:#4a86d8;stroke-width:6;stroke-linecap:round}.motor.run .rot{animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.motor .mt{font:700 13px Arial,sans-serif;fill:var(--lbl);text-anchor:middle}
#pausePill{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:5;background:var(--accent);color:var(--onaccent);padding:4px 14px;border-radius:999px;font-size:.85rem}

</style><style id="tsCss">

<style id="collapseCss">

<style id="floatCss">

<style id="netCss">:root{--n0:#185d00;--n1:#bb459b;--n2:#2382ba;--n3:#718509;--n4:#87544b;--n5:#2e7065;--n6:#823bae;--n7:#7c60db;--n8:#05441d;--n9:#4134ab;--n10:#670242;--n11:#03527b;--n12:#900538;--n13:#884783;--n14:#4a710a;--n15:#138b90;--n16:#095b46;--n17:#106c8f;--n18:#4d4671;--n19:#64855d;}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--n0:#79d963;--n1:#ff94dd;--n2:#55aee8;--n3:#819808;--n4:#cd958b;--n5:#599a8e;--n6:#c780f7;--n7:#bcb2fd;--n8:#69ba7c;--n9:#9499fd;--n10:#f46eb4;--n11:#78c7fd;--n12:#fe9ead;--n13:#cf88c8;--n14:#7eba27;--n15:#14bbc2;--n16:#1addae;--n17:#1f99c7;--n18:#a39ece;--n19:#a6c99f;}}:root[data-theme="dark"]{--n0:#79d963;--n1:#ff94dd;--n2:#55aee8;--n3:#819808;--n4:#cd958b;--n5:#599a8e;--n6:#c780f7;--n7:#bcb2fd;--n8:#69ba7c;--n9:#9499fd;--n10:#f46eb4;--n11:#78c7fd;--n12:#fe9ead;--n13:#cf88c8;--n14:#7eba27;--n15:#14bbc2;--n16:#1addae;--n17:#1f99c7;--n18:#a39ece;--n19:#a6c99f;}#fig .wc{fill:none;stroke-width:2.6;stroke-linejoin:miter;display:none;transition:opacity .15s}#fig .wh{fill:none;stroke:transparent;stroke-width:14;pointer-events:none}body.netcolor #fig .wc{display:inline}body.netcolor #fig .wh{pointer-events:stroke;cursor:pointer}body.netcolor #fig .w{stroke:transparent}body.netcolor #fig .w.hot{stroke:var(--flow)}body.netfocus #fig .wc{opacity:.18}body.netfocus #fig .wc.fo{opacity:1;stroke-width:4.4}#tmk{display:none;pointer-events:none}body.netmark #tmk{display:inline}#tmk .tm{--mc:var(--muted)}#tmk rect{fill:var(--panel);fill-opacity:.92;stroke:var(--mc);stroke-width:1}#tmk text{fill:var(--mc);font:700 12px Arial,Helvetica,sans-serif;text-anchor:middle;dominant-baseline:central}#tmk line{stroke:var(--mc);stroke-width:1}body.netfocus #tmk .tm{opacity:.35}body.netfocus #tmk .tm.fo{opacity:1}</style><style id="olCss">

<main class="wrap">

/* ---- 求解 ---- */
function solve(){
  var adj={},i,e;
  for(i=0;i<edges.length;i++){e=edges[i];if(!e.on()){continue;}(adj[e.a]=adj[e.a]||[]).push([e.b,e]);(adj[e.b]=adj[e.b]||[]).push([e.a,e]);}
  function reach(sd){var s={},q=[sd];s[sd]=true;while(q.length){var n=q.pop(),l=adj[n]||[];for(var j=0;j<l.length;j++){if(!s[l[j][0]]){s[l[j][0]]=true;q.push(l[j][0]);}}}return s;}
  var rnet=st.power?reach('R0'):{},tnet=reach('T0'),on={},hot=new Set();
  function paths(from,to){var seen={},stack=[];seen[from]=true;(function dfs(n){if(n===to){stack.forEach(function(x){hot.add(x);});return;}var l=adj[n]||[];for(var j=0;j<l.length;j++){var m=l[j][0];if(seen[m]){continue;}seen[m]=true;stack.push(l[j][1]);dfs(m);stack.pop();seen[m]=false;}})(from);}
  loads.forEach(function(L){var f=false,ra=null,tb=null;
    if(rnet[L.a]&&tnet[L.b]){f=true;ra=L.a;tb=L.b;}else if(rnet[L.b]&&tnet[L.a]){f=true;ra=L.b;tb=L.a;}
    on[L.key]=f;if(f){paths('R0',ra);paths(tb,'T0');}});
  return {on:on,hot:hot,rnet:rnet};
}

function message(r){
  var p=st.p,c=st.c;
  if(!st.power){return ['斷電中','整個電路沒有電,所有元件都不會動作。按「送電」開始。'];}
  if(mode==='t1'){
    if(st.tripped){return ['OL 已跳脫','OL 接點斷開,MC 這一路不通,按住 ON 也不會動作。按「OL 復歸」後才能再操作。'];}
    if(p.ON){return ['按住 ON','MC 線圈通電,MC 動作。這個電路沒有自保接點,手一放開就停,所以要一直按住。'];}
    if(c.MC){return ['放開 ON','ON 回彈斷開,MC 立刻斷電復歸。'];}
    return ['送電待機','MC 沒有電。按住 ON 讓 MC 通電,放開 ON 就立刻斷電(寸動),可用來測試元件或微調機器。'];
  }
  if(mode==='t2'){
    if(st.tripped){return ['OL 已跳脫','OL 接點斷開,兩個電路的 MC 都斷電。按「OL 復歸」後才能再操作。'];}
    if((p.ON&&p.OFF)||(p.ON2&&p.OFF2)){return ['ON 與 OFF 同時按下','左圖(動作優先):ON 直接接到 MC,OFF 擋不住,MC 通電。右圖(復歸優先):OFF 串在整組前面,先把電源切斷,MC 不通電。'];}

    if(p.ON||p.ON2){return ['按著 ON','ON 接通,MC 通電;MC 的自保接點閉合後,放開 ON 也能維持。'];}
    if(c.MC||c.MC2){return ['MC 自保持中','放開 ON 後由 MC 接點維持通電。按 OFF 可以停止。'];}
    return ['送電待機','試試同時按下 ON 與 OFF(鍵盤 a+s,或按「同時按住 OFF＋ON」),比較左右兩個電路的結果。'];

  var g=el('g',{id:'olhit'});svg.appendChild(g);
  var terms=svg.querySelectorAll('circle.term'),labs=svg.querySelectorAll('#labels text');
  Array.prototype.forEach.call(bars,function(ob){
    var b;try{b=ob.getBBox();}catch(x){return;}
    if(!b||(!b.width&&!b.height)){return;}
    var x0=b.x,y0=b.y,x1=b.x+b.width,y1=b.y+b.height;
    var L=x0-45,R=x1+16,T=y0-18,B=y1+18;
    Array.prototype.forEach.call(terms,function(c){
      var cx=+c.getAttribute('cx'),cy=+c.getAttribute('cy'),r=+c.getAttribute('r');
      if(cx>=L&&cx<=R&&cy>=T&&cy<=B){x0=Math.min(x0,cx-r);x1=Math.max(x1,cx+r);y0=Math.min(y0,cy-r);y1=Math.max(y1,cy+r);}
    });
    Array.prototype.forEach.call(labs,function(t){
      if(!RE.test((t.textContent||'').trim())){return;}
      var q;try{q=t.getBBox();}catch(x){return;}
      var mx=q.x+q.width/2,my=q.y+q.height/2;
      if(mx>=L-10&&mx<=x1+75&&my>=T-6&&my<=B+6){x0=Math.min(x0,q.x);x1=Math.max(x1,q.x+q.width);y0=Math.min(y0,q.y);y1=Math.max(y1,q.y+q.height);}
    });
    var p=6,r=el('rect',{x:x0-p,y:y0-p,width:x1-x0+2*p,height:y1-y0+2*p,rx:6,'class':'olhit',tabindex:'0',role:'button'},g);
    var ti=el('title',{},r);mark(r,ti);hm.push([r,ti]);
    ['pointerenter','focus'].forEach(function(t){r.addEventListener(t,function(){mark(r,ti);});});
    r.addEventListener('click',fire);
    r.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.repeat){e.preventDefault();fire();}});
  });
}
/* 主電路的積熱電驛方框 */
if(svg2){
  Array.prototype.forEach.call(svg2.querySelectorAll('.th'),function(r){
    var ti=el('title',{},r);mark(r,ti);tm.push([r,ti]);
    r.addEventListener('pointerenter',function(){mark(r,ti);});
  });
  svg2.addEventListener('click',function(e){var t=e.target;if(t&&t.closest&&t.closest('.th')){fire();}});
}
var w=svg.querySelector('#wires'),pend=false;
if(w){new MutationObserver(function(){if(pend){return;}pend=true;Promise.resolve().then(function(){pend=false;rebuild();});}).observe(w,{childList:true});}
rebuild();thText();
setInterval(refresh,250);   /* 滑鼠停在 OL 上時,送電、暫停、跳脫狀態改變也要即時更新提示 */
window.__ol={n:function(){return document.querySelectorAll('#olhit .olhit').length;}};
})();
</script>
