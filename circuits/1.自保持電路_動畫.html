/* ---- 求解 ---- */
function solve(){
  var adj={},i,e;
  for(i=0;i<edges.length;i++){e=edges[i];if(!e.on()){continue;}(adj[e.a]=adj[e.a]||[]).push([e.b,e]);(adj[e.b]=adj[e.b]||[]).push([e.a,e]);}
  function reach(sd){var s={},q=[sd];s[sd]=true;while(q.length){var n=q.pop(),l=adj[n]||[];for(var j=0;j<l.length;j++){if(!s[l[j][0]]){s[l[j][0]]=true;q.push(l[j][0]);}}}return s;}
  var rnet=st.power?reach('R0'):{},tnet=reach('T0'),on={},hot=new Set();
  function paths(from,to){var seen={},stack=[];seen[from]=true;(function dfs(n){if(n===to){stack.forEach(function(x){hot.add(x);});return;}var l=adj[n]||[];for(var j=0;j<l.length;j++){var m=l[j][0];if(seen[m]){continue;}seen[m]=true;stack.push(l[j][1]);dfs(m);stack.pop();seen[m]=false;}})(from);}
  loads.forEach(function(L){var f=false,ra=null,tb=null;
    if(rnet[L.a]&&tnet[L.b]){f=true;ra=L.a;tb=L.b;}else if(rnet[L.b]&&tnet[L.a]){f=true;ra=L.b;tb=L.a;}
    on[L.key]=f;if(f){paths('R0',ra);paths(tb,'T0');}});
  return {on:on,hot:hot,rnet:rnet};
}

async function exec(sc,id){

    await hold(run);if(!run()){break;}

    else if(c==='U'){e=one(a[1]);if(e){pe(e,'pointerup');}await sl(400);}
    else if(c==='C'){e=one(a[1]);if(e){clk(e);}await sl(500);}
    else if(c==='W'){await sl(+a[1]);}
    else if(c==='WI'){e=one(a[1]);await sl(((e&&parseFloat(e.value))||3)*1000+600);}
    else if(c==='S'){e=one(a[1]);if(e&&!e.disabled){e.value=a[2];e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));}await sl(150);}

    else if(c==='CI'){e=one(a[1]);if(e&&e.textContent.indexOf(a[2])>=0){clk(e);}await sl(300);}

  if(ok){running=false;runMsg='已執行完';sPause=false;showRun();}

}

  stopRun();var s=list[idx];if(!s){return;}runId++;exec(s[4]||'',runId).catch(fail);
}
/* 全部播放中跳到指定步驟(重播、上一步、下一步、點步驟編號):取消目前腳本,迴圈改到該步重跑,之後繼續往後播 */

/* 從第 from 步開始播放到最後一步;每步結束停 2.5 秒讓人看結果;暫停鍵可暫停;自己動手操作電路才會停止 */
async function runAll(from){
  quiet=false;stopRun();allOn=true;var tok=++allTok;jump=-1;updAll();idx=from;
  try{
    while(allOn&&tok===allTok){
      show();runId++;var id=runId;
      var ok=await exec(list[idx][4]||'',id);
      if(!allOn||tok!==allTok){return;}
      if(jump>=0){idx=jump;jump=-1;continue;}
      if(!ok){break;}
      if(idx>=list.length-1){allOn=false;allTok++;updAll();runMsg='全部播放完畢';showRun();return;}
      for(var left=2500;left>0&&jump<0;left-=100){await sl(100);if(!allOn||tok!==allTok){return;}}
      if(jump>=0){idx=jump;jump=-1;continue;}
      idx++;

  }catch(x){fail(x);return;}
  if(allOn&&tok===allTok){allOn=false;allTok++;updAll();showRun();}

(function(){

<script id="stJs">
/* 測試步驟模式的左右兩欄版面(試做)。把原本的卡片「搬進」版面,離開(切到選擇題)時搬回原位;

(function(){'use strict';

function place(n){var ph=document.createComment('st');n.parentNode.insertBefore(ph,n);moved.push({n:n,ph:ph});
  var a=n.parentElement;while(a&&a.tagName!=='MAIN'&&hid.indexOf(a)<0){hid.push(a);a=a.parentElement;}}
function build(){

  on=true;document.body.classList.add('stlay');moved=[];hid=[];views=[];
  var tabs=main.querySelector(':scope > [role="group"][aria-label="選擇電路"]');

  if(tabs){R.appendChild(tabs);}
  cs.forEach(function(c){var r=rank(c);

    else if(r===1){c.classList.add('st-fig','st-card');R.appendChild(c);addView(c,svg,'fig');}
    else{c.classList.add(r===10?'st-main':'st-rest');if(r===10){c.classList.add('st-card');}Low.appendChild(c);if(r===10){addView(c,c.querySelector('#fig2'),'main');}}});
  if(Low.children.length){R.appendChild(Low);}
  hid.sort(function(a,b){return b.contains(a)?-1:a.contains(b)?1:0;}).forEach(function(b){
    var rest=Array.prototype.filter.call(b.children,function(k){return !k.classList.contains('st-hide')&&k.tagName!=='SCRIPT'&&k.tagName!=='STYLE';});

  if(window.MutationObserver){var mo=new MutationObserver(sched);views.forEach(function(v){mo.observe(v.svg,{attributes:true,attributeFilter:['viewBox']});});obs.push(mo);}

function dissolve(){

    ['width','maxHeight','maxWidth','height','marginLeft','marginRight'].forEach(function(k){v.svg.style[k]='';});v.card.classList.remove('st-card');});

/* ---- 縮放列與平移 ---- */
function addView(card,sv,kind){
  var h2=card.querySelector(':scope > h2'),title=h2?h2.textContent.replace(/【.*?】/g,'').trim():'';

  bar.querySelector('.stT').textContent=title;
  var view=mk('div',null,'stView');

  card.insertBefore(bar,view);
  var v={card:card,view:view,svg:sv,bar:bar,kind:kind,z:1,hint:bar.querySelector('.stHint'),m:bar.querySelector('.stZm'),d:bar.querySelector('.stZ0'),p:bar.querySelector('.stZp')};
  v.m.addEventListener('click',function(){setZ(v,v.z-0.1);});v.p.addEventListener('click',function(){setZ(v,v.z+0.1);});v.d.addEventListener('click',function(){setZ(v,1,true);});

function vhU(u){if(u==='svh'&&!(window.CSS&&CSS.supports&&CSS.supports('height','100svh'))){return innerHeight;}var d=document.createElement('div');d.style.cssText='position:fixed;left:-9px;top:0;width:1px;visibility:hidden;pointer-events:none;height:100'+u;document.body.appendChild(d);var h=d.offsetHeight;document.body.removeChild(d);return h||innerHeight;}
function fit(){
  if(!on){return;}

    var vb=v.svg.viewBox&&v.svg.viewBox.baseVal;if(!vb||!vb.width){return;}
    var cw=Math.max(100,v.view.clientWidth),base=cw;
    if(v.kind==='fig'&&figH()!=='none'){
      var chrome=v.card.offsetHeight-v.view.offsetHeight,avail;
      if(desk){avail=innerHeight-(v.card.getBoundingClientRect().top+window.pageYOffset)-chrome-12;}
      else if(innerHeight<=520&&innerWidth>innerHeight){avail=vhU('svh')-chrome-16;}
      else{avail=(innerWidth<600?0.5:0.46)*Math.max(vhU('vh'),innerHeight)-chrome-2;}
      base=Math.min(cw,Math.max(150,avail)*vb.width/vb.height);

    v.svg.style.marginLeft=v.svg.style.marginRight=(w<=cw?'auto':'0');
    v.view.style.height=Math.ceil(base*vb.height/vb.width)+'px';
    v.m.disabled=v.z<=0.5+1e-6;v.p.disabled=v.z>=2-1e-6;
    v.d.innerHTML=Math.abs(v.z-1)<1e-6?'預設':'預設 <small>'+Math.round(v.z*100)+'%</small>';

}
var pend=0;function sched(){if(pend){return;}pend=requestAnimationFrame(function(){pend=0;fit();});}

function pan(v){
  var w=v.view,id=null,sx=0,sy=0,sl=0,stp=0,drag=false,just=false;

    if(e.target.closest&&e.target.closest(NOPAN)){return;}              /* 只從空白處(不是按鈕、OL、點線高亮的粗線)開始 */

/* ---- 步驟卡高度固定:用目前寬度量「最長的一步」,切換步驟時下面的操作區不跳動 ---- */

    sp[0].textContent=s[1];sp[1].textContent=s[2];mx=Math.max(mx,c.offsetHeight);});
