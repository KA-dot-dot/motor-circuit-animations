<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>1.自保持電路_動畫</title>
<style>
:root{--bg:#f2f5f8;--panel:#fff;--ink:#18212d;--muted:#556172;--line:#d3dbe5;--wire:#3a3a3a;--dot:#111;--lbl:#222;--term:#cde8f5;--tint:#cde8f5;--on:#d8352a;--flow:#ee8a22;--accent:#1d5fa6;--onaccent:#fff;--bz:#ff9d2e;--font:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--panel:#18202a;--ink:#e8edf3;--muted:#9aa7b8;--line:#2b3643;--wire:#b6c1ce;--dot:#e8edf3;--lbl:#e8edf3;--term:#2d5167;--tint:#26475a;--on:#ff5547;--flow:#ffb04d;--accent:#6aa9ee;--onaccent:#0c1218;--bz:#ffa63d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151b;--panel:#18202a;--ink:#e8edf3;--muted:#9aa7b8;--line:#2b3643;--wire:#b6c1ce;--dot:#e8edf3;--lbl:#e8edf3;--term:#2d5167;--tint:#26475a;--on:#ff5547;--flow:#ffb04d;--accent:#6aa9ee;--onaccent:#0c1218;--bz:#ffa63d;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.25rem;line-height:1.3;margin:0 0 4px}.sub{margin:0 0 10px;color:var(--muted);font-size:.88rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.side{display:grid;gap:12px;min-width:0}.status{order:-1}
@media (min-width:960px){.stage{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-areas:"ctrl ctrl" "main fig" "stat fig" "leg leg"}
body.nomain .stage{grid-template-areas:"ctrl ctrl" "stat fig" "leg leg"}
.stage .side{display:contents}.fm{grid-area:main}.fc{grid-area:fig}.controls{grid-area:ctrl;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px}.status{grid-area:stat;order:0}.legend{grid-area:leg}
.controls h2{display:none}.controls .row{display:contents}.controls .switch{margin:0}.controls .hint{margin:0;flex:1 1 260px;font-size:.8rem}.legend ul{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.fig{padding:8px}
h2{font-size:.8rem;letter-spacing:.08em;margin:0 0 10px;color:var(--muted);font-weight:500}
.controls .row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer;min-height:40px;touch-action:none}
.btn:hover:not(:disabled){border-color:var(--accent)}.btn:focus-visible,.switch input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}.btn:disabled{opacity:.45;cursor:not-allowed}
.switch{display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer}.switch input{width:18px;height:18px;accent-color:var(--accent)}
.hint{margin:10px 0 0;color:var(--muted);font-size:.85rem}
.chips{list-style:none;margin:0 0 12px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.chips li{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;font-size:.85rem}
.chips i{width:11px;height:11px;border-radius:50%;background:var(--line);flex:none}.chips li.on{border-color:var(--c)}.chips li.on i{background:var(--c)}
.chips b{margin-left:auto;font-weight:500;color:var(--muted)}.chips li.on b{color:var(--ink)}
.msg-title{font-weight:700;margin:0 0 4px}.msg{margin:0;min-height:4.4em}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:.9rem}.legend li{display:flex;gap:10px;align-items:center}.legend svg{flex:none}
#fig2{display:block;width:100%;height:auto;max-height:60vh}#fig{display:block;width:100%;height:auto;max-height:80vh}
.lb{font:14px Arial,Helvetica,sans-serif;fill:var(--lbl)}.lb.big{font-size:16px}.lb.t{font-size:15px;font-weight:700}
.w{fill:none;stroke:var(--wire);stroke-width:1.5}
.w.hot{stroke:var(--flow);stroke-width:2.8;stroke-dasharray:7 5;animation:flow .7s linear infinite}@keyframes flow{to{stroke-dashoffset:-12}}
.w.live{stroke:var(--flow);stroke-width:2.2}
.dot{fill:var(--dot)}.term{fill:var(--term);stroke:var(--wire);stroke-width:1.5}
.pl{stroke:var(--wire);stroke-width:3}.sl{stroke:var(--wire);stroke-width:2.2}
.ct .fillb,.ct .outb{display:none}.ct.act .pl,.ct.act .sl{display:none}
.ct.act:not(.nc) .fillb{display:inline;fill:var(--on);stroke:none}.ct.act.nc .outb{display:inline;fill:none;stroke:var(--on);stroke-width:2.6}
.ct.live .fillb{display:inline;fill:var(--on);stroke:none}.ct.live .pl{display:none}.ct.live .sl{stroke:var(--panel)}
.barl{stroke:var(--wire);stroke-width:3}.lever{stroke:var(--wire);stroke-width:2.2}
.pb{cursor:pointer;outline:none;touch-action:none}.pb .bar{transition:transform .1s}
.pb:not(.nc).pressed .bar{transform:translateX(-11px)}.pb.nc.pressed .bar{transform:translateX(-10px)}
.pb.pressed .barl,.pb.pressed .lever{stroke:var(--on)}.pb.pressed .lb{fill:var(--on);font-weight:700}
.pb .hit{fill:transparent}.pb:hover .hit{fill:color-mix(in srgb,var(--accent) 14%,transparent)}.pb:focus-visible .hit{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}
.fuse rect{fill:var(--tint);stroke:var(--wire);stroke-width:2.5}.fuse line{stroke:var(--wire);stroke-width:1.8}
.coil .body,.lamp .body{fill:var(--tint);stroke:var(--wire);stroke-width:1.8;transition:fill .12s}
.coil text,.lamp text{font:13px Arial,Helvetica,sans-serif;fill:var(--lbl);text-anchor:middle}
.coil.on .body{fill:var(--on)}.coil.on text{fill:#fff;font-weight:700}
.coil.bz.on .body{fill:var(--bz)}.coil.bz .wave{fill:none;stroke:var(--bz);stroke-width:2.6;stroke-linecap:round;opacity:0}.coil.bz.on .wave{opacity:1}.coil.bz.on .wg{animation:shake .14s linear infinite}@keyframes shake{50%{transform:translateX(2px)}}
.lamp .halo{fill:var(--hc);opacity:0;transition:opacity .12s}.lamp.on .halo{opacity:.4}
.lamp .ray{stroke:var(--wire);stroke-width:1.5}.lamp.on .ray{stroke:var(--rc);stroke-width:2.6}.lamp.on .body{fill:var(--lc)}.lamp.on text{fill:var(--tc);font-weight:700}
.olbar{transition:transform .2s}.olbar line{stroke:var(--wire);stroke-width:3}.olbar line.x{stroke-width:2.2}.olbar.tripped{transform:rotate(-29deg)}.olbar.tripped line{stroke:var(--on)}
.blade{stroke:var(--wire);stroke-width:2.5;stroke-linecap:round}.mech{stroke:var(--wire);stroke-width:1;stroke-dasharray:3 3}
.th{fill:var(--panel);stroke:var(--wire);stroke-width:1.5}.th.tripped{stroke:var(--on);stroke-width:2.6}
.motor .body{fill:var(--tint);stroke:var(--wire);stroke-width:1.8}.motor.run .body{stroke:var(--on);stroke-width:2.8}
.motor .rot line{stroke:#4a86d8;stroke-width:6;stroke-linecap:round}.motor.run .rot{animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.motor .mt{font:700 13px Arial,sans-serif;fill:var(--lbl);text-anchor:middle}
#pausePill{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:5;background:var(--accent);color:var(--onaccent);padding:4px 14px;border-radius:999px;font-size:.85rem}
body.paused .w.hot,body.paused .coil.bz.on .wg,body.paused .motor.run .rot{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.motor.run .rot,.coil.bz.on .wg{animation:none}.w.hot{animation:none;stroke-dasharray:none}.pb .bar,.olbar{transition:none}}
</style></head><body>
<div id="pausePill" hidden>已暫停</div>
<main class="wrap">
<h1 id="h1"></h1><p class="sub" id="sub"></p>
<div class="tabs" role="group" aria-label="選擇電路"><button class="btn" id="tab_t1" type="button">分頁1:寸動電路</button><button class="btn" id="tab_t2" type="button">分頁2:動作優先與復歸優先</button><button class="btn" id="tab_t3" type="button">分頁3:自保持電路(含主電路)</button></div>
<div class="stage">
<div class="card fig fm" id="cardMain"><h2>主電路</h2><svg id="fig2" viewBox="0 0 300 380" role="img" aria-label="主電路:NFB、MC 主接點、積熱電驛 TH-RY 與馬達 M"></svg></div>
<div class="card fig fc"><h2>控制電路</h2><svg id="fig" viewBox="0 0 360 460" role="img"><g id="wires"></g><g id="dots"></g><g id="parts"></g><g id="labels"></g></svg></div>
<aside class="side">
<section class="card controls" aria-label="操作"><h2>操作</h2><div class="row">
<button class="btn" id="btnPause" type="button" aria-pressed="false">暫停(空白鍵)</button>
<button class="btn" id="btnPower" type="button" aria-pressed="true">送電中</button>
<button class="btn" id="btnTrip" type="button">模擬 OL 跳脫</button>
<button class="btn" id="btnResetOL" type="button" disabled>OL 復歸</button>
<button class="btn" id="btnReset" type="button">全部重設</button>
<button class="btn" id="btnBoth" type="button" hidden>同時按住 OFF＋ON</button>
<button class="btn" id="btnSnd" type="button" aria-pressed="true">聲音:開</button></div>
<label class="switch" for="chkFlow"><input type="checkbox" id="chkFlow"><span>顯示電流路徑</span></label>
<p class="hint" id="hint">按住滑鼠或手指按下按鈕,放開後彈回。鍵盤:a 代表 OFF、s 代表 ON,空白鍵暫停。</p></section>
<section class="card status" aria-label="目前狀態"><h2>目前狀態</h2><ul class="chips" id="chips"></ul><div aria-live="polite"><p class="msg-title" id="msgTitle"></p><p class="msg" id="msgBody"></p></div></section>
<section class="card legend" aria-label="圖例"><h2>圖例</h2><ul>
<li><svg width="34" height="16" aria-hidden="true"><circle cx="17" cy="8" r="7" fill="var(--on)"/></svg><span>紅色圓圈:線圈通電;紅色按鈕:被按下</span></li>
<li><svg width="34" height="16" aria-hidden="true"><rect x="3" y="2" width="28" height="12" fill="var(--on)"/></svg><span>紅色塗滿:接通並有電流通過的接點</span></li>
<li><svg width="34" height="16" aria-hidden="true"><rect x="4" y="3" width="26" height="10" fill="none" stroke="var(--on)" stroke-width="2.6"/></svg><span>紅色外框:動作後打開的接點,斜線消失</span></li>
<li><svg width="34" height="16" aria-hidden="true"><line x1="3" y1="8" x2="31" y2="8" stroke="var(--flow)" stroke-width="2.8" stroke-dasharray="7 5"/></svg><span>橘色流動線:電流經過的路徑</span></li></ul></section>
</aside></div></main>
<script>
(function(){'use strict';
var NS='http://www.w3.org/2000/svg',$=function(i){return document.getElementById(i);};
var svg=$('fig'),svg2=$('fig2'),gW=svg.querySelector('#wires'),gD=svg.querySelector('#dots'),gP=svg.querySelector('#parts'),gL=svg.querySelector('#labels');
var st={power:true,tripped:false,flow:false,p:{},c:{}};
var edges=[],loads=[],acts=[],pbEls=[],coilEls={},lampEls={},olbars=[],mode='t1';
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a){e.setAttribute(k,a[k]);}if(p){p.appendChild(e);}return e;}
function txt(x,y,s,c,an){var t=el('text',{x:x,y:y,'class':c||'lb'},gL);if(an){t.setAttribute('text-anchor',an);}t.textContent=s;return t;}
function wire(a,b,d){var p=el('path',{d:d,'class':'w'},gW);edges.push({a:a,b:b,el:p,on:function(){return true;}});}
function swi(a,b,fn){edges.push({a:a,b:b,on:fn});}
function load(a,b,k){loads.push({a:a,b:b,key:k});}
function dot(x,y){el('circle',{cx:x,cy:y,r:3.5,'class':'dot'},gD);}
function mcT(k){return function(){return st.c[k];};}
function fuse(x,y,lab,na,nb){var g=el('g',{'class':'fuse'},gP);el('rect',{x:x,y:y-10,width:38,height:20},g);el('line',{x1:x,y1:y+10,x2:x+38,y2:y-10},g);edges.push({a:na,b:nb,on:function(){return true;}});txt(x+19,y-18,lab,'lb','middle');}
function contact(cx,y1,y2,hw,o){
  var g=el('g',{'class':'ct'+(o.slash?' nc':'')},gP);
  el('rect',{x:cx-hw,y:y1-1.5,width:2*hw,height:(y2-y1)+3,'class':'fillb'},g);el('rect',{x:cx-hw,y:y1,width:2*hw,height:y2-y1,'class':'outb'},g);
  el('line',{x1:cx-hw,y1:y1,x2:cx+hw,y2:y1,'class':'pl'},g);el('line',{x1:cx-hw,y1:y2,x2:cx+hw,y2:y2,'class':'pl'},g);
  if(o.slash){el('line',{x1:cx-7,y1:y2+4,x2:cx+7,y2:y1-4,'class':'sl'},g);}
  acts.push([g,o.test,o.live]);txt(o.lx,o.ly,'MC','lb');
}
function button(id,label,c,yt,nc){
  var yb=yt+36,m=yt+18,bx=nc?c-5:c+11,g=el('g',{'class':'pb'+(nc?' nc':''),'data-pb':id,tabindex:'0',role:'button','aria-label':label+' 按鈕,按住時按下'},gP);
  el('rect',{x:c-14,y:yt-10,width:92,height:56,rx:6,'class':'hit'},g);
  el('circle',{cx:c,cy:yt,r:5,'class':'term'},g);el('circle',{cx:c,cy:yb,r:5,'class':'term'},g);
  var bar=el('g',{'class':'bar'},g);el('line',{x1:bx,y1:yt-6,x2:bx,y2:yb+6,'class':'barl'},bar);el('line',{x1:bx,y1:m,x2:bx+15,y2:m,'class':'lever'},bar);
  el('text',{x:bx+21,y:m+5,'class':'lb'},g).textContent=label;pbEls.push(g);st.p[id]=false;
}
function coil(key,cx,cy,label,bz){
  var g=el('g',{'class':'coil'+(bz?' bz':'')},gP);
  if(bz){var wg=el('g',{'class':'wg'},g);[-1,1].forEach(function(s){[25,32].forEach(function(r,i){el('path',{d:'M'+(cx-r)+' '+(cy-7-i*2)+'Q'+(cx-r-4)+' '+cy+' '+(cx-r)+' '+(cy+7+i*2),'class':'wave'},wg);});});}
  el('circle',{cx:cx,cy:cy,r:18,'class':'body'},g);el('text',{x:cx,y:cy+4.6},g).textContent=label||key;coilEls[key]=g;
}
function lamp(key,cx,cy,c){
  var g=el('g',{'class':'lamp',style:'--lc:'+c[0]+';--rc:'+c[0]+';--hc:'+c[1]+';--tc:'+c[2]},gP);
  el('circle',{cx:cx,cy:cy,r:27,'class':'halo'},g);
  [45,135,225,315].forEach(function(a){var r=a*Math.PI/180,cs=Math.cos(r),sn=Math.sin(r);el('line',{x1:cx+21*cs,y1:cy+21*sn,x2:cx+31*cs,y2:cy+31*sn,'class':'ray'},g);});
  el('circle',{cx:cx,cy:cy,r:18,'class':'body'},g);el('text',{x:cx,y:cy+4.6},g).textContent=key;lampEls[key]=g;
}
/* OL:co=true 為切換接點(96、95/97、98);false 為常閉接點(96、95) */
function ol(cx,yt,co){
  var yb=yt+36,m=yt+18,bx=cx-5;
  [yt,yb].forEach(function(y){el('circle',{cx:cx,cy:y,r:5,'class':'term'},gP);});
  if(co){el('circle',{cx:cx-25,cy:yt,r:5,'class':'term'},gP);txt(cx-25,yt-10,'98','lb','middle');}
  var g=el('g',{'class':'olbar',style:'transform-origin:'+bx+'px '+yb+'px'},gP);
  el('line',{x1:bx,y1:yt-6,x2:bx,y2:yb+6},g);el('line',{x1:bx-4,y1:m-4,x2:bx+4,y2:m+4,'class':'x'},g);el('line',{x1:bx+4,y1:m-4,x2:bx-4,y2:m+4,'class':'x'},g);
  olbars.push(g);txt(cx+18,m+5,'OL');txt(cx+12,yt-4,'96');txt(cx+12,yb+17,co?'95/97':'95');
}
function olEdges(a,b,a98){swi(a,b,function(){return !st.tripped;});if(a98){swi(a98,b,function(){return st.tripped;});}}

/* ---- 分頁1:寸動電路(圖2) ---- */
function buildT1(){
  txt(22,55,'R','lb big','middle');txt(22,415,'T','lb big','middle');
  wire('R0','t1','M40 50H200V90');button('ON','ON',200,90,false);swi('t1','t2',function(){return st.p.ON;});
  wire('t2','CT','M200 126V182');coil('MC',200,200);load('CT','CB','MC');
  wire('CB','ot','M200 218V270');ol(200,270,false);olEdges('ot','ob');wire('ob','T0','M200 306V410H40');
  st.c={MC:false};
}
/* ---- 分頁2:動作優先(左)與復歸優先(右)(圖3) ---- */
function buildT2(){
  txt(180,26,'動作優先電路','lb t','middle');txt(520,26,'復歸優先電路','lb t','middle');
  txt(22,55,'R','lb big','middle');txt(22,435,'T','lb big','middle');txt(422,55,'R','lb big','middle');txt(422,435,'T','lb big','middle');
  edges.push({a:'R0',b:'R1',on:function(){return true;}});edges.push({a:'T0',b:'T1',on:function(){return true;}});
  /* 左:OFF 與 MC 接點相串,ON 直接接到線圈 */
  wire('R0','L110','M40 50H110');wire('L110','L260','M110 50H260');dot(110,50);
  wire('L110','a1','M110 50V100');button('OFF','OFF',110,100,true);swi('a1','a2',function(){return !st.p.OFF;});
  wire('a2','c1','M110 136V170');contact(110,170,185,16,{lx:132,ly:182,test:mcT('MC')});swi('c1','c2',mcT('MC'));wire('c2','JL','M110 185V250H260');
  wire('L260','b1','M260 50V140');button('ON','ON',260,140,false);swi('b1','b2',function(){return st.p.ON;});wire('b2','JL','M260 176V250');dot(260,250);
  wire('JL','CT','M260 250V282');coil('MC',260,300);load('CT','CB','MC');wire('CB','ot','M260 318V350');ol(260,350,false);olEdges('ot','ob');
  wire('ob','T260','M260 386V430');wire('T260','T110','M260 430H110');wire('T110','T0','M110 430H40');
  /* 右:OFF 串在整組(ON 並接 MC 接點)的前面 */
  wire('R1','K','M440 50H560');wire('K','e1','M560 50V90');button('OFF2','OFF',560,90,true);swi('e1','e2',function(){return !st.p.OFF2;});
  wire('e2','A2','M560 126V165');dot(560,165);button('ON2','ON',560,185,false);wire('A2','f1','M560 165V185');swi('f1','f2',function(){return st.p.ON2;});wire('f2','B2','M560 221V250');
  contact(480,195.5,210.5,16,{lx:502,ly:208,test:mcT('MC2')});wire('A2','h1','M560 165H480V195.5');swi('h1','h2',mcT('MC2'));wire('h2','B2','M480 210.5V250H560');dot(560,250);
  wire('B2','CT2','M560 250V282');coil('MC2',560,300,'MC');load('CT2','CB2','MC2');wire('CB2','ot2','M560 318V350');ol(560,350,false);olEdges('ot2','ob2');
  wire('ob2','T560','M560 386V430');wire('T560','T1','M560 430H440');
  st.c={MC:false,MC2:false};
}
/* ---- 分頁3:自保持電路(圖1) ---- */
function buildT3(){
  txt(22,65,'R','lb big','middle');txt(22,505,'T','lb big','middle');
  wire('R0','Fa','M40 60H62');fuse(62,60,'F1','Fa','Fb');wire('Fb','J170','M100 60H170');wire('J170','J300','M170 60H300');wire('J300','J420','M300 60H420');wire('J420','J530','M420 60H530');
  wire('T530','T420','M530 500H420');wire('T420','T300','M420 500H300');wire('T300','Tb','M300 500H100');fuse(62,500,'F2','Tb','Ta');wire('Ta','T0','M62 500H40');
  [170,300,420].forEach(function(x){dot(x,60);});dot(420,500);dot(300,500);
  /* BZ 支路:經 98 接到 OL */
  wire('J170','BZt','M170 60V302');coil('BZ',170,320,'BZ',true);load('BZt','BZb','BZ');wire('BZb','o98','M170 338V380H275');

function solve(){
  var adj={},i,e;

    if(rnet[L.a]&&tnet[L.b]){f=true;ra=L.a;tb=L.b;}else if(rnet[L.b]&&tnet[L.a]){f=true;ra=L.b;tb=L.a;}
    on[L.key]=f;if(f){paths('R0',ra);paths(tb,'T0');}});

}
