<div id="pausePill" hidden>已暫停</div>
<main class="wrap">
<h1>三相感應電動機正逆轉控制電路</h1>
<p class="sub">直接按圖上的 STOP、FOR、REV,順序不限,例如在正轉中按 REV 看看會怎樣。通電或動作的元件會變紅,左側主電路的馬達會跟著轉動。</p>
<div class="stage">
<div class="card fig fm"><h2>主電路</h2>
<svg id="fig2" viewBox="0 0 480 400" role="img" aria-label="主電路:NFB、MCF 與 MCR 主接點、積熱電驛 TH-RY 與馬達 M"></svg></div>
<div class="card fig fc"><h2>控制電路</h2>
<svg id="fig" viewBox="0 0 620 500" role="img" aria-label="正逆轉控制電路圖,含 STOP、FOR、REV、MCF、MCR、RL、YL、GL、BZ 與 OL"><g id="wires"></g><g id="dots"></g><g id="parts"></g><g id="labels"></g></svg></div>
<aside class="side">
<section class="card controls" aria-label="操作"><h2>操作</h2>
<div class="row">
<button class="btn" id="btnPause" type="button" aria-pressed="false">暫停(空白鍵)</button>
<button class="btn" id="btnPower" type="button" aria-pressed="true">送電中</button>
<button class="btn" id="btnTrip" type="button">模擬 OL 跳脫</button>
<button class="btn" id="btnResetOL" type="button" disabled>OL 復歸</button>
<button class="btn" id="btnReset" type="button">全部重設</button>
<button class="btn" id="btnSnd" type="button" aria-pressed="true">聲音:開</button></div>
<label class="switch" for="chkFlow"><input type="checkbox" id="chkFlow"><span>顯示電流路徑</span></label>
<p class="hint">按住滑鼠或手指按下按鈕,放開後彈回。鍵盤:a = STOP、s = FOR、d = REV;空白鍵暫停。</p></section>
<section class="card status" aria-label="目前狀態"><h2 id="stTitle">目前狀態</h2><ul class="chips" id="chips"></ul>
<div aria-live="polite"><p class="msg-title" id="msgTitle"></p><p class="msg" id="msgBody"></p></div></section>
<section class="card legend" aria-label="圖例"><h2>圖例</h2><ul>
<li><svg width="34" height="16" aria-hidden="true"><circle cx="17" cy="8" r="7" fill="var(--on)"/></svg><span>紅色圓圈:線圈通電;紅色按鈕:被按下</span></li>
<li><svg width="34" height="16" aria-hidden="true"><rect x="3" y="2" width="28" height="12" fill="var(--on)"/></svg><span>紅色塗滿:接通並有電流通過的接點</span></li>
<li><svg width="34" height="16" aria-hidden="true"><rect x="4" y="3" width="26" height="10" fill="none" stroke="var(--on)" stroke-width="2.6"/></svg><span>紅色外框:動作後打開的接點,斜線消失</span></li>
<li><svg width="34" height="16" aria-hidden="true"><line x1="3" y1="8" x2="31" y2="8" stroke="var(--flow)" stroke-width="2.8" stroke-dasharray="7 5"/></svg><span>橘色流動線:電流經過的路徑</span></li></ul></section>
</aside></div></main>
<script>
(function(){'use strict';
var NS='http://www.w3.org/2000/svg',$=function(i){return document.getElementById(i);};
var svg=$('fig'),gW=$('wires'),gD=$('dots'),gP=$('parts'),gL=$('labels');
var st={power:true,tripped:false,flow:false,p:{STOP:false,FOR:false,REV:false},c:{MCF:false,MCR:false}};
var edges=[],loads=[],acts=[],pbEls=[],coilEls={},lampEls={},bzEl=null,olbar=null;
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a){e.setAttribute(k,a[k]);}if(p){p.appendChild(e);}return e;}
function txt(x,y,s,c,an){var t=el('text',{x:x,y:y,'class':c||'lb'},gL);if(an){t.setAttribute('text-anchor',an);}t.textContent=s;return t;}

function dot(x,y){el('circle',{cx:x,cy:y,r:3.5,'class':'dot'},gD);}
function contact(cx,y1,y2,hw,o){
  var g=el('g',{'class':'ct'+(o.slash?' nc':'')},gP);
  el('rect',{x:cx-hw,y:y1-1.5,width:2*hw,height:y2-y1+3,'class':'fillb'},g);
  el('rect',{x:cx-hw,y:y1,width:2*hw,height:y2-y1,'class':'outb'},g);
  el('line',{x1:cx-hw,y1:y1,x2:cx+hw,y2:y1,'class':'pl'},g);el('line',{x1:cx-hw,y1:y2,x2:cx+hw,y2:y2,'class':'pl'},g);
  if(o.slash){el('line',{x1:o.slash[0],y1:o.slash[1],x2:o.slash[2],y2:o.slash[3],'class':'sl'},g);}
  acts.push([g,o.test,o.live]);txt(o.lx,o.ly,o.label);
}
function button(name,c,o){
  var g=el('g',{'class':'pb'+(o.nc?' nc':''),'data-pb':name,tabindex:'0',role:'button','aria-label':name+' 按鈕,按住時按下'},gP);
  el('rect',{x:c-12,y:o.hy,width:84,height:64,rx:6,'class':'hit'},g);
  el('circle',{cx:c,cy:o.yt,r:4,'class':'term'},g);el('circle',{cx:c,cy:o.yb,r:4,'class':'term'},g);
  var b=el('g',{'class':'bar'},g);
  el('line',{x1:o.bx,y1:o.by1,x2:o.bx,y2:o.by2,'class':'barl'},b);el('line',{x1:o.bx,y1:o.ly,x2:o.lx,y2:o.ly,'class':'lever'},b);
  el('text',{x:o.tx,y:o.ty,'class':'lb'},g).textContent=name;pbEls.push(g);
}
function coil(k,cx,cy){var g=el('g',{'class':'coil'},gP);el('circle',{cx:cx,cy:cy,r:18,'class':'body'},g);el('text',{x:cx,y:cy+4.6},g).textContent=k;coilEls[k]=g;}
function lamp(k,cx,cy,c){
  var g=el('g',{'class':'lamp',style:'--lc:'+c[0]+';--rc:'+c[1]+';--hc:'+c[2]+';--tc:'+c[3]},gP);
  el('circle',{cx:cx,cy:cy,r:27,'class':'halo'},g);
  [45,135,225,315].forEach(function(a){var r=a*Math.PI/180,cs=Math.cos(r),sn=Math.sin(r);el('line',{x1:cx+21*cs,y1:cy+21*sn,x2:cx+31*cs,y2:cy+31*sn,'class':'ray'},g);});
  el('circle',{cx:cx,cy:cy,r:18,'class':'body'},g);el('text',{x:cx,y:cy+4.6},g).textContent=k;lampEls[k]=g;
}
function buzzer(cx,cy){
  var g=el('g',{'class':'bz'},gP),w=el('g',{'class':'wg'},g);
  el('path',{d:'M'+(cx-24)+' '+(cy-8)+'Q'+(cx-29)+' '+cy+' '+(cx-24)+' '+(cy+8),'class':'wave'},w);
  el('path',{d:'M'+(cx-30)+' '+(cy-14)+'Q'+(cx-38)+' '+cy+' '+(cx-30)+' '+(cy+14),'class':'wave'},w);

function fuse(x,y,name){
  var fz=el('g',{'class':'fuse'},gP);el('rect',{x:x,y:y,width:38,height:20},fz);el('line',{x1:x,y1:y+20,x2:x+38,y2:y},fz);txt(x+19,y-8,name,'lb','middle');
}
var mc=function(k){return function(){return st.c[k];};},nmc=function(k){return function(){return !st.c[k];};},pbt=function(n){return function(){return st.p[n];};};

/* ---------- 控制電路(座標與繪製用 SVG 相同) ---------- */
function buildCtl(){
  txt(28,45.5,'R','lb big','middle');txt(28,470.5,'T','lb big','middle');
  wire('R0','Fa','M50 40H60');fuse(60,30,'F1');swi('Fa','Fb',function(){return true;});
  wire('Fb','J110','M98 40H110');wire('J110','J320','M110 40H320');wire('J320','J540','M320 40H540');
  /* STOP(NC) */
  wire('J320','pst','M320 40V66');swi('pst','psb',function(){return !st.p.STOP;});wire('psb','B320','M320 110V125');
  button('STOP',320,{nc:true,yt:70,yb:106,bx:316,by1:70,by2:106,ly:88,lx:331,tx:338,ty:93,hy:56});
  wire('B320','B268','M320 125H268');wire('B268','B185','M268 125H185');wire('B320','B365','M320 125H365');wire('B365','B450','M365 125H450');
  /* 正轉列 FOR → MCF */
  wire('B268','ft','M268 125V144');swi('ft','fb',pbt('FOR'));wire('fb','A268','M268 188V205');
  button('FOR',268,{yt:148,yb:184,bx:278,by1:142,by2:190,ly:166,lx:293,tx:284,ty:159,hy:134});
  wire('B185','hFt','M185 125V158.5');swi('hFt','hFb',mc('MCF'));wire('hFb','A268','M185 173.5V205H268');
  contact(185,158.5,173.5,16,{label:'MCF',lx:207,ly:170,test:mc('MCF')});
  wire('A268','nRt','M268 205V233');swi('nRt','nRb',nmc('MCR'));wire('nRb','N268','M268 248V278');
  contact(268,233,248,16,{slash:[260,252,276,229],label:'MCR',lx:290,ly:245,test:mc('MCR'),live:function(r){return !!r.on.MCF;}});
  wire('N268','CTF','M268 278V302');coil('MCF',268,320);load('CTF','CBF','MCF');wire('CBF','BB268','M268 338V360');
  wire('N268','LT1','M268 278H185V302');lamp('RL',185,320,['#e5484d','#e5484d','#ff8a8a','#fff']);load('LT1','LB1','RL');wire('LB1','BB185','M185 338V360');
  /* 反轉列 REV → MCR */
  wire('B450','rt','M450 125V144');swi('rt','rb',pbt('REV'));wire('rb','A450','M450 188V205');
  button('REV',450,{yt:148,yb:184,bx:460,by1:142,by2:190,ly:166,lx:475,tx:466,ty:159,hy:134});
  wire('B365','hRt','M365 125V158.5');swi('hRt','hRb',mc('MCR'));wire('hRb','A450','M365 173.5V205H450');
  contact(365,158.5,173.5,16,{label:'MCR',lx:387,ly:170,test:mc('MCR')});
  wire('A450','nFt','M450 205V233');swi('nFt','nFb',nmc('MCF'));wire('nFb','N450','M450 248V278');
  contact(450,233,248,16,{slash:[442,252,458,229],label:'MCF',lx:472,ly:245,test:mc('MCF'),live:function(r){return !!r.on.MCR;}});
  wire('N450','CTR','M450 278V302');coil('MCR',450,320);load('CTR','CBR','MCR');wire('CBR','BB450','M450 338V360');
  wire('N450','LT2','M450 278H365V302');lamp('YL',365,320,['#f2c200','#d9a400','#ffe066','#3a2c00']);load('LT2','LB2','YL');wire('LB2','BB365','M365 338V360');
  wire('BB185','BB268','M185 360H268');wire('BB268','BB365','M268 360H365');wire('BB365','BB450','M365 360H450');
  /* GL:兩個常閉接點 */
  wire('J540','g1t','M540 40V82');swi('g1t','g1b',nmc('MCF'));wire('g1b','g2t','M540 97V178');swi('g2t','g2b',nmc('MCR'));wire('g2b','GLt','M540 193V302');
  contact(540,82,97,16,{slash:[532,101,548,78],label:'MCF',lx:560,ly:94,test:mc('MCF'),live:function(r){return !!r.on.GL;}});
  contact(540,178,193,16,{slash:[532,197,548,174],label:'MCR',lx:560,ly:190,test:mc('MCR'),live:function(r){return !!r.on.GL;}});
  lamp('GL',540,320,['#2f9e58','#2f9e58','#7ee0a0','#fff']);load('GLt','GLb','GL');wire('GLb','T540','M540 338V465');

  wire('BB450','OLt','M450 360V380');swi('OLt','OLb',function(){return !st.tripped;});swi('OLl','OLb',function(){return st.tripped;});wire('OLb','T450','M450 435V465');
  [[450,385],[450,430],[425,385]].forEach(function(p){el('circle',{cx:p[0],cy:p[1],r:5,'class':'term'},gP);});
  olbar=el('g',{'class':'olbar'},gP);
