<style>

<div id="pausePill" hidden>已暫停</div>
<main class="wrap">
<h1>三相感應電動機正逆轉控制電路</h1>
<p class="sub">直接按圖上的 STOP、FOR、REV,順序不限,例如在正轉中按 REV 看看會怎樣。通電或動作的元件會變紅,左側主電路的馬達會跟著轉動。</p>
<section class="card tsCard" id="tsCard" aria-label="測試步驟">
<h2>測試步驟</h2>
<div class="tsBar"><button class="btn tsB" id="tsPrev" type="button" aria-label="上一步">◀</button>
<div class="tsMain" aria-live="polite"><p class="tsHead"><b id="tsNo"></b><span id="tsTitle"></span><em id="tsRun"></em></p>
<p class="tsRow"><i>操作</i><span id="tsDo"></span></p><p class="tsRow"><i>預期</i><span id="tsSee"></span></p></div>
<button class="btn tsB" id="tsNext" type="button" aria-label="下一步">▶</button></div>
<div class="tsCtl"><button class="btn" id="tsPlay" type="button">↻ 重播此步驟</button><button class="btn" id="tsAll" type="button" aria-pressed="false">▶ 從頭播放全部</button><button class="btn" id="tsFrom" type="button">▶ 從此步驟播放</button><label class="switch"><input type="checkbox" id="tsAuto" checked><span>切換步驟時自動執行(自動按鍵、等計時)</span></label></div>
<div class="tsDots" id="tsDots" role="group" aria-label="步驟清單"></div>
</section>
<div id="tsFloat" hidden>
<div class="tfPanel" id="tfPanel" role="region" aria-label="測試步驟(浮動視窗)" hidden>
<div class="tfHead"><span><b id="tfStep"></b><span id="tfTitle"></span><em id="tfRun"></em></span><button type="button" class="tfX" id="tfClose" aria-label="收起步驟視窗">✕</button></div>
<p class="tsRow"><i>操作</i><span id="tfDo"></span></p><p class="tsRow"><i>預期</i><span id="tfSee"></span></p>
<div class="tfBtns"><button class="btn" id="tfAll" type="button">▶ 從頭播放全部</button><button class="btn" id="tfFrom" type="button">▶ 從此步驟播放</button><button class="btn" id="tfRe" type="button">↻ 重播此步驟</button><button class="btn" id="tfPause" type="button">⏸ 暫停</button></div>
</div>
<div class="tfBar"><button class="tfNav" id="tfPrev" type="button" aria-label="上一步">◀</button><button class="tfBall" id="tfBall" type="button" aria-expanded="false" aria-label="展開或收起測試步驟,可拖曳移動"><span><b id="tfNo">1</b><small id="tfTot">/17</small></span></button><button class="tfNav" id="tfNext" type="button" aria-label="下一步">▶</button></div>
</div>

<div class="stage">
<div class="card fig fm"><h2>主電路</h2>
<svg id="fig2" viewBox="0 0 480 400" role="img" aria-label="主電路:NFB、MCF 與 MCR 主接點、積熱電驛 TH-RY 與馬達 M"></svg></div>
<div class="card fig fc"><h2>控制電路</h2>
<svg id="fig" viewBox="0 0 620 500" role="img" aria-label="正逆轉控制電路圖,含 STOP、FOR、REV、MCF、MCR、RL、YL、GL、BZ 與 OL"><g id="wires"></g><g id="dots"></g><g id="parts"></g><g id="labels"></g></svg></div>
<aside class="side">
<section class="card controls" aria-label="操作"><h2>操作</h2>
<div class="row">
<button class="btn" id="btnPause" type="button" aria-pressed="false">暫停(空白鍵)</button>
<button class="btn" id="btnPower" type="button" aria-pressed="true">送電中</button>
<button class="btn" id="btnTrip" type="button">模擬 OL 跳脫</button>
<button class="btn" id="btnResetOL" type="button" disabled>OL 復歸</button>
<button class="btn" id="btnReset" type="button">全部重設</button>
<button class="btn" id="btnSnd" type="button" aria-pressed="true">聲音:開</button></div>
<label class="switch" for="chkFlow"><input type="checkbox" id="chkFlow"><span>顯示電流路徑</span></label>
<p class="hint">按住滑鼠或手指按下按鈕,放開後彈回。鍵盤:a = STOP、s = FOR、d = REV;空白鍵暫停。</p></section>
<section class="card status" aria-label="目前狀態"><h2 id="stTitle">目前狀態</h2><ul class="chips" id="chips"></ul>
<div aria-live="polite"><p class="msg-title" id="msgTitle"></p><p class="msg" id="msgBody"></p></div></section>
<section class="card legend" aria-label="圖例"><h2>圖例</h2><ul>
<li><svg width="34" height="16" aria-hidden="true"><circle cx="17" cy="8" r="7" fill="var(--on)"/></svg><span>紅色圓圈:線圈通電;紅色按鈕:被按下</span></li>
<li><svg width="34" height="16" aria-hidden="true"><rect x="3" y="2" width="28" height="12" fill="var(--on)"/></svg><span>紅色塗滿:接通並有電流通過的接點</span></li>
<li><svg width="34" height="16" aria-hidden="true"><rect x="4" y="3" width="26" height="10" fill="none" stroke="var(--on)" stroke-width="2.6"/></svg><span>紅色外框:動作後打開的接點,斜線消失</span></li>
<li><svg width="34" height="16" aria-hidden="true"><line x1="3" y1="8" x2="31" y2="8" stroke="var(--flow)" stroke-width="2.8" stroke-dasharray="7 5"/></svg><span>橘色流動線:電流經過的路徑</span></li></ul></section>
</aside></div></main>
<script>
(function(){'use strict';
var NS='http://www.w3.org/2000/svg',$=function(i){return document.getElementById(i);};
var svg=$('fig'),gW=$('wires'),gD=$('dots'),gP=$('parts'),gL=$('labels');

var edges=[],loads=[],acts=[],pbEls=[],coilEls={},lampEls={},bzEl=null,olbar=null;

/* ---------- 求解 ---------- */
function solve(){
  var adj={},i,e;
  for(i=0;i<edges.length;i++){e=edges[i];if(!e.on()){continue;}(adj[e.a]=adj[e.a]||[]).push([e.b,e]);(adj[e.b]=adj[e.b]||[]).push([e.a,e]);}
  function reach(sd){var s={},q=[sd];s[sd]=true;while(q.length){var n=q.pop(),l=adj[n]||[];for(var j=0;j<l.length;j++){if(!s[l[j][0]]){s[l[j][0]]=true;q.push(l[j][0]);}}}return s;}
  var rnet=st.power?reach('R0'):{},tnet=reach('T0'),on={},hot=new Set();
  function paths(from,to){var seen={},stack=[];seen[from]=true;(function dfs(n){if(n===to){stack.forEach(function(x){hot.add(x);});return;}
    var l=adj[n]||[];for(var j=0;j<l.length;j++){var m=l[j][0];if(seen[m]){continue;}seen[m]=true;stack.push(l[j][1]);dfs(m);stack.pop();seen[m]=false;}})(from);}
  loads.forEach(function(L){var f=false,ra=null,tb=null;
    if(rnet[L.a]&&tnet[L.b]){f=true;ra=L.a;tb=L.b;}else if(rnet[L.b]&&tnet[L.a]){f=true;ra=L.b;tb=L.a;}
    on[L.key]=f;if(f){paths('R0',ra);paths(tb,'T0');}});
  return {on:on,hot:hot,rnet:rnet};
}

}

    if(!h){
      h=document.createElement('h2');h.className='xh';
      h.textContent=card.getAttribute('aria-label')||(card.classList.contains('controls')?'操作':'控制電路');
      card.insertBefore(h,card.firstChild);
    }
    var name=(h.textContent||'').replace(/【.*?】/g,'').trim()||'此區塊';
    var b=document.createElement('button');
    b.type='button';b.className='cbtn';
    b.innerHTML='<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path d="M3.5 6h11L9 13z" fill="currentColor"/></svg>';
    function sync(){
      var c=card.classList.contains('collapsed');
      b.setAttribute('aria-expanded',c?'false':'true');
      b.setAttribute('aria-label',(c?'展開':'收合')+'「'+name+'」');
      b.title=(c?'展開':'收合')+name;
    }
    function toggle(){card.classList.toggle('collapsed');sync();}
    b.addEventListener('click',toggle);
    /* 空白鍵在鈕上用來收合,不要觸發頁面的暫停 */
    b.addEventListener('keydown',function(e){if(e.key===' '){e.preventDefault();e.stopPropagation();if(!e.repeat){toggle();}}});
    b.addEventListener('keyup',function(e){if(e.key===' '){e.preventDefault();e.stopPropagation();}});
    h.addEventListener('click',toggle);
    card.classList.add('collapsible');
    card.appendChild(b);sync();
  }
  function all(){Array.prototype.forEach.call(document.querySelectorAll('.card'),init);}
  all();
})();
</script>
</body></html>
