<div id="pausePill" hidden>已暫停</div>
<main class="wrap">
<h1>電動機循環控制電路</h1>
<p class="sub">按「ON」啟動:MC1 先運轉,T1 計時後換 MC2 運轉,T2 計時後再回到 MC1,如此循環;按「OFF」停止。通電或動作的元件會變紅,左側主電路的馬達會跟著轉動。</p>
<div class="stage">
<div class="card fig fm"><h2>主電路</h2><svg id="fig2" viewBox="0 0 360 440" role="img" aria-label="主電路:NFB、MC1 與 MC2 主接點、積熱電驛 TH-RY1、TH-RY2 與馬達 M1、M2"></svg></div>
<div class="card fig fc"><h2>控制電路</h2><svg id="fig" viewBox="0 0 700 500" role="img" aria-label="循環控制電路圖,含 OFF、ON、X、MC1、MC2、T1、T2、RL1、RL2、GL、BZ 與 OL1、OL2"><g id="wires"></g><g id="dots"></g><g id="parts"></g><g id="labels"></g></svg></div>
<aside class="side">
<section class="card controls" aria-label="操作"><h2>操作</h2>
<div class="row"><button class="btn" id="btnPause" type="button" aria-pressed="false">暫停(空白鍵)</button><button class="btn" id="btnPower" type="button" aria-pressed="true">送電中</button><button class="btn" id="btnTrip" type="button">模擬 OL 跳脫</button><button class="btn" id="btnResetOL" type="button" disabled>OL 復歸</button><button class="btn" id="btnReset" type="button">全部重設</button><button class="btn" id="btnSnd" type="button" aria-pressed="true">聲音:開</button></div>
<label class="switch" for="chkFlow"><input type="checkbox" id="chkFlow"><span>顯示電流路徑</span></label>
<div class="row tm"><label for="sT1">T1 <input type="number" id="sT1" min="1" max="10" step="0.5" value="3"> 秒</label><label for="sT2">T2 <input type="number" id="sT2" min="1" max="10" step="0.5" value="3"> 秒</label></div>
<p class="hint">按住滑鼠或手指按下按鈕,放開後彈回。鍵盤:a 代表 OFF,s 代表 ON,空白鍵暫停或繼續。計時電驛通電時不能改秒數。</p></section>
<section class="card status" aria-label="目前狀態"><h2>目前狀態</h2><ul class="chips" id="chips"></ul><div aria-live="polite"><p class="msg-title" id="msgTitle"></p><p class="msg" id="msgBody"></p></div></section>
<section class="card legend" aria-label="圖例"><h2>圖例</h2><ul>
<li><svg width="34" height="16" aria-hidden="true"><circle cx="17" cy="8" r="7" fill="var(--on)"/></svg><span>紅色圓圈:線圈通電;紅色按鈕:被按下</span></li>
<li><svg width="34" height="16" aria-hidden="true"><rect x="3" y="2" width="28" height="12" fill="var(--on)"/></svg><span>紅色塗滿:接通並有電流通過的接點</span></li>
<li><svg width="34" height="16" aria-hidden="true"><rect x="4" y="3" width="26" height="10" fill="none" stroke="var(--on)" stroke-width="2.6"/></svg><span>紅色外框:動作後打開的接點,斜線消失</span></li>
<li><svg width="34" height="16" aria-hidden="true"><line x1="3" y1="8" x2="31" y2="8" stroke="var(--flow)" stroke-width="2.8" stroke-dasharray="7 5"/></svg><span>橘色流動線:電流經過的路徑</span></li></ul></section>
</aside></div></main>
<script>
(function(){'use strict';
var NS='http://www.w3.org/2000/svg',setSec={T1:3,T2:3};
var svg=document.getElementById('fig'),svg2=document.getElementById('fig2');
var gW=svg.querySelector('#wires'),gD=svg.querySelector('#dots'),gP=svg.querySelector('#parts'),gL=svg.querySelector('#labels');
var st={power:true,flow:false,tr:[false,false],p:{OFF:false,ON:false},c:{X:false,MC1:false,MC2:false,T1:false,T2:false},d:{T1:false,T2:false},t:{T1:0,T2:0}};
var edges=[],loads=[],acts=[],pbEls=[],coilEls={},lampEls={},ols=[],tms={},bzEl=null;
function el(tag,a,parent){var e=document.createElementNS(NS,tag);for(var k in a){e.setAttribute(k,a[k]);}if(parent){parent.appendChild(e);}return e;}
function txt(x,y,s,cls,an){var t=el('text',{x:x,y:y,'class':cls||'lb'},gL);if(an){t.setAttribute('text-anchor',an);}t.textContent=s;return t;}
function wire(a,b,d){var p=el('path',{d:d,'class':'w'},gW);edges.push({a:a,b:b,el:p,on:function(){return true;}});}
function swi(a,b,fn){edges.push({a:a,b:b,on:fn});}
function load(a,b,key){loads.push({a:a,b:b,key:key});}
function dot(x,y){el('circle',{cx:x,cy:y,r:3.5,'class':'dot'},gD);}
function contact(cx,y1,y2,hw,o){
  var g=el('g',{'class':'ct'+(o.slash?' nc':'')},gP);
  el('rect',{x:cx-hw,y:y1-1.5,width:2*hw,height:(y2-y1)+3,'class':'fillb'},g);
  el('rect',{x:cx-hw,y:y1,width:2*hw,height:(y2-y1),'class':'outb'},g);
  el('line',{x1:cx-hw,y1:y1,x2:cx+hw,y2:y1,'class':'pl'},g);
  el('line',{x1:cx-hw,y1:y2,x2:cx+hw,y2:y2,'class':'pl'},g);
  if(o.slash){el('line',{x1:o.slash[0],y1:o.slash[1],x2:o.slash[2],y2:o.slash[3],'class':'sl'},g);}
  acts.push([g,o.test,o.live]);txt(o.lx,o.ly,o.label,'lb',o.la||'start');
}
function tcontact(cx,yt,yb,nc,label,test,live){
  var g=el('g',{'class':'tk'+(nc?' nc':'')},gP),m=(yt+yb)/2,bx=cx+(nc?4:11);
  el('circle',{cx:cx,cy:yt,r:4,'class':'term'},g);el('circle',{cx:cx,cy:yb,r:4,'class':'term'},g);
  var b=el('g',{'class':'tbar'},g);
  el('line',{x1:bx,y1:yt-6,x2:bx,y2:yb+6},b);
  el('polygon',{points:bx+','+(m-9)+' '+bx+','+(m+9)+' '+(bx+14)+','+m},b);
  acts.push([g,test,live]);txt(cx+26,m+5,label);
}
function button(name,c,o){
  var g=el('g',{'class':'pb'+(o.nc?' nc':''),'data-pb':name,tabindex:'0',role:'button','aria-label':name+' 按鈕,按住時按下'},gP);
  el('rect',{x:c-12,y:o.hy,width:64,height:o.hh,rx:6,'class':'hit'},g);
  el('circle',{cx:c,cy:o.yt,r:4,'class':'term'},g);el('circle',{cx:c,cy:o.yb,r:4,'class':'term'},g);
  var bar=el('g',{'class':'bar'},g);
  el('line',{x1:o.bx,y1:o.by1,x2:o.bx,y2:o.by2,'class':'barl'},bar);
  el('line',{x1:o.bx,y1:o.ly,x2:o.lx,y2:o.ly,'class':'lever'},bar);
  var t=el('text',{x:o.tx,y:o.ty,'class':'lb'},g);t.textContent=name;pbEls.push(g);
}
function coil(key,cx,cy){var g=el('g',{'class':'coil'},gP);el('circle',{cx:cx,cy:cy,r:18,'class':'body'},g);var t=el('text',{x:cx,y:cy+4.6},g);t.textContent=key;coilEls[key]=g;}
function lamp(key,cx,cy,c){
  var g=el('g',{'class':'lamp',style:'--lc:'+c+';--rc:'+c+';--hc:'+c+';--tc:#fff'},gP);
  el('circle',{cx:cx,cy:cy,r:27,'class':'halo'},g);
  [45,135,225,315].forEach(function(a){var r=a*Math.PI/180,cs=Math.cos(r),sn=Math.sin(r);el('line',{x1:cx+21*cs,y1:cy+21*sn,x2:cx+31*cs,y2:cy+31*sn,'class':'ray'},g);});
  el('circle',{cx:cx,cy:cy,r:18,'class':'body'},g);var t=el('text',{x:cx,y:cy+4.6},g);t.textContent=key;lampEls[key]=g;
}
function fuse(x,y,n){var g=el('g',{'class':'fuse'},gP);el('rect',{x:x,y:y-10,width:38,height:20},g);el('line',{x1:x,y1:y+10,x2:x+38,y2:y-10},g);txt(x+19,y-17,n,'lb','middle');}
function ol(k,top,bot){
  var n=k+1,mid=(top+bot)/2,N='O'+n;
  [[420,top],[420,bot],[400,top+6]].forEach(function(p){el('circle',{cx:p[0],cy:p[1],r:4,'class':'term'},gP);});
  var g=el('g',{'class':'olbar',style:'transform-origin:420px '+bot+'px'},gP);
  el('line',{x1:416,y1:top,x2:416,y2:bot},g);
  el('line',{x1:411,y1:mid-4,x2:421,y2:mid+4,'class':'x'},g);el('line',{x1:411,y1:mid+4,x2:421,y2:mid-4,'class':'x'},g);
  ols.push(g);
  swi(N+'t',N+'b',function(){return !st.tr[k];});swi(N+'l',N+'b',function(){return st.tr[k];});
  txt(476,mid+5,'OL');txt(430,top+4,'96','lb sm');txt(430,bot+4,'95/97','lb sm');txt(400,top+24,'98','lb sm','middle');
}
var ON=function(k){return function(){return st.c[k];};};

function buildCtl(){
  txt(30,70,'R','lb big','middle');txt(30,485,'T','lb big','middle');
  wire('R0','Fa','M50 65H70');fuse(70,65,'F1');edges.push({a:'Fa',b:'Fb',on:function(){return true;}});
  wire('Fb','J130','M108 65H130');wire('J130','J230','M130 65H230');wire('J230','J300','M230 65H300');wire('J300','J670','M300 65H670');

  wire('J130','CTZ','M130 65V282');
  var bg=el('g',{'class':'bz'},gP);el('circle',{cx:130,cy:300,r:18,'class':'body'},bg);
  var wg=el('g',{'class':'wg'},bg);el('path',{d:'M108 289Q103 300 108 311','class':'wave'},wg);el('path',{d:'M99 282Q91 300 99 318','class':'wave'},wg);
  var bt=el('text',{x:130,y:304.6},bg);bt.textContent='BZ';bzEl=bg;load('CTZ','CBZ','BZ');
  wire('CBZ','Z1','M130 318V378H365');wire('Z1','O1l','M365 378H400');
  /* OFF / ON / 自保 */
  wire('J230','p1t','M230 65V80');swi('p1t','p1b',function(){return !st.p.OFF;});wire('p1b','A','M230 116V135');

  })(from);}

/* 每張卡片右上角加收合鈕;沒有標題的卡片自動補標題 */
(function(){
  'use strict';
  function init(card){
    if(card.querySelector(':scope > .cbtn')){return;}
    var h=card.querySelector(':scope > h2, :scope > h3');
    if(!h){
      h=document.createElement('h2');h.className='xh';
      h.textContent=card.getAttribute('aria-label')||(card.classList.contains('controls')?'操作':'控制電路');
      card.insertBefore(h,card.firstChild);
    }
    var name=(h.textContent||'').replace(/【.*?】/g,'').trim()||'此區塊';
    var b=document.createElement('button');
    b.type='button';b.className='cbtn';
    b.innerHTML='<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path d="M3.5 6h11L9 13z" fill="currentColor"/></svg>';
    function sync(){
      var c=card.classList.contains('collapsed');
      b.setAttribute('aria-expanded',c?'false':'true');
      b.setAttribute('aria-label',(c?'展開':'收合')+'「'+name+'」');
      b.title=(c?'展開':'收合')+name;
    }
    function toggle(){card.classList.toggle('collapsed');sync();}
    b.addEventListener('click',toggle);
    /* 空白鍵在鈕上用來收合,不要觸發頁面的暫停 */
    b.addEventListener('keydown',function(e){if(e.key===' '){e.preventDefault();e.stopPropagation();if(!e.repeat){toggle();}}});
    b.addEventListener('keyup',function(e){if(e.key===' '){e.preventDefault();e.stopPropagation();}});
    h.addEventListener('click',toggle);
    card.classList.add('collapsible');
    card.appendChild(b);sync();
  }
  function all(){Array.prototype.forEach.call(document.querySelectorAll('.card'),init);}
  all();
})();
</script>
