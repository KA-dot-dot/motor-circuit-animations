<main class="wrap">
<h1>4.電動機降壓啟動（Y-Δ 起動）</h1>
<p class="sub">按圖上 ON 啟動：先 Y 連接起動，Y-Δ 限時電驛計時到再切成 Δ 連接運轉。下方可選量測點，看紅棒、黑棒接哪兩點會量到 127 V 或 220 V。</p>
<div class="stage">

<button class="btn" id="btnPower" type="button" aria-pressed="true">送電中</button>
<button class="btn" id="btnTrip" type="button">模擬 OL 跳脫</button>
<button class="btn" id="btnResetOL" type="button" disabled>OL 復歸</button>
<button class="btn" id="btnReset" type="button">全部重設</button>
<button class="btn" id="btnSnd" type="button" aria-pressed="true">聲音:開</button></div>
<div class="tm"><label for="sT">Y-Δ 計時 <input type="number" id="sT" min="1" max="10" step="0.5" value="3"> 秒</label></div>
<label class="switch" for="chkFlow"><input type="checkbox" id="chkFlow"><span>顯示電流路徑</span></label>
<p class="hint">按住按鈕、放開彈回；鍵盤 a＝OFF、s＝ON；空白鍵暫停。</p></section>
<div class="card fig fc"><h2>控制電路</h2><svg id="fig" viewBox="250 22 460 330" role="img" aria-label="Y-Δ 降壓啟動控制電路，含 OFF、ON、MC、MCY、MCΔ、Y-Δ 限時電驛、RL、YL、GL、BZ 與 OL"><g id="wires"></g><g id="dots"></g><g id="parts"></g><g id="labels"></g></svg></div>
<div class="card fig fm"><h2>主電路（含量測點）</h2><div class="row" id="tabs" style="margin-bottom:8px"><button class="btn" id="tab1" type="button" aria-pressed="true">分頁 1：MC、MCΔ、MCY 接點一列</button><button class="btn" id="tab2" type="button" aria-pressed="false">分頁 2：乙級冰水主機（端子排 X Y Z）</button><button class="btn" id="tab3" type="button" aria-pressed="false">分頁 3：乙級冰水主機（端子排 Z X Y）</button></div><svg id="fig2" viewBox="0 0 440 430" role="img" aria-label="主電路：NFB、MC、TH-RY、MCΔ、MCY 與電動機端子 U1 V1 W1 U2 V2 W2"></svg><div class="row" id="brkRow" hidden style="margin-top:8px;align-items:center"><span class="hint" style="flex:none">模擬 6C 環線斷一條線：</span><button class="btn" data-b="0" type="button" aria-pressed="true">正常</button><button class="btn" data-b="1" type="button" aria-pressed="false">斷粉紅線</button><button class="btn" data-b="2" type="button" aria-pressed="false">斷棕線</button><button class="btn" data-b="3" type="button" aria-pressed="false">斷青藍線</button></div><div class="ynote" id="ynote" hidden></div></div>

<li><svg width="34" height="16" aria-hidden="true"><rect x="3" y="2" width="28" height="12" fill="var(--on)"/></svg><span>紅色塗滿：閉合的接點</span></li>
<li><svg width="34" height="16" aria-hidden="true"><rect x="4" y="3" width="26" height="10" fill="none" stroke="var(--on)" stroke-width="2.6"/></svg><span>紅色外框：動作後打開的接點</span></li>

</div></main>

 for(i=0;i<edges.length;i++){e=edges[i];if(!e.on()){continue;}(adj[e.a]=adj[e.a]||[]).push([e.b,e]);(adj[e.b]=adj[e.b]||[]).push([e.a,e]);}
 function reach(s0){var s={},q=[s0];s[s0]=true;while(q.length){var n=q.pop(),l=adj[n]||[];for(var j=0;j<l.length;j++){if(!s[l[j][0]]){s[l[j][0]]=true;q.push(l[j][0]);}}}return s;}
 var rnet=st.power?reach('R0'):{},tnet=reach('T0'),on={},hot=new Set();
 function paths(from,to){var seen={},stack=[];seen[from]=true;(function dfs(n){if(n===to){stack.forEach(function(x){hot.add(x);});return;}
  var l=adj[n]||[];for(var j=0;j<l.length;j++){var m=l[j][0];if(seen[m]){continue;}seen[m]=true;stack.push(l[j][1]);dfs(m);stack.pop();seen[m]=false;}})(from);}
 loads.forEach(function(L){var f=false,ra=null,tb=null;
  if(rnet[L.a]&&tnet[L.b]){f=true;ra=L.a;tb=L.b;}else if(rnet[L.b]&&tnet[L.a]){f=true;ra=L.b;tb=L.a;}
  on[L.key]=f;if(f){paths('R0',ra);paths(tb,'T0');}});
 return {on:on,hot:hot,rnet:rnet};
}

function message(){

 if(st.tripped){return ['OL 跳脫','積熱電驛動作，控制電路斷電，蜂鳴器 BZ 響。按「OL 復歸」後要重新按 ON 啟動。'];}
 if(p.OFF){return ['按著 OFF','OFF 是常閉按鈕，按下後切斷自保持，MC 與 Y-Δ 電驛斷電，接點依序放開。'];}
 if(!st.c.MC&&!st.c.TR){return ['送電待機','綠燈 GL 亮，表示送電但尚未啟動。按 ON 啟動。'];}

 if(st.c.MC&&st.d){return ['Δ 連接運轉中','Y-Δ 計時完成，MCY 斷電、MCΔ 通電，黃燈 YL 亮。這時量 '+nm('U')+' 是 220 V，電動機全壓運轉。按 OFF 可停止。'];}

 var m=message();if(tab>1&&st.brk&&lo()){if(st.c.MCY){m[1]+=' 環線的'+['粉紅線','棕線','青藍線'][st.brk-1]+'斷了，但其餘兩條仍把 Z、X、Y 連在一起，還是 Y 接，電動機照常運轉。';}else if(st.d){m[1]+=' 環線斷路只影響 Y 階段；Δ 運轉時 6C 接點是打開的，不受影響。';}}$('msgTitle').textContent=m[0]+(paused?'【已暫停】':'');$('msgBody').textContent=m[1];

/* ---- 逐級更新、計時、暫停 ---- */
var timer=0,busy=false,paused=false,relPend={};
function settle(){
 clearTimeout(timer);busy=false;if(paused){render(solve());return;}
 var r=solve(),ch=false,n=0;
 Object.keys(st.c).forEach(function(k){var v=!!r.on[k];if(v!==st.c[k]){st.c[k]=v;ch=true;sfxCoil(k,v,(n++)*.012);}});
 if(!st.c.TR){if(st.d){st.d=false;ch=true;}st.t=0;}
 if(ch){r=solve();}render(r);if(ch){busy=true;timer=setTimeout(settle,170);}
}
setInterval(function(){if(paused){return;}
 if(st.c.TR&&!st.d){st.t+=0.1;if(st.t>=setSec-1e-6){st.t=setSec;st.d=true;}if(busy){render(solve());}else{settle();}}
},100);
var down={},downAt={},relT={};
function press(n){if(paused){return;}down[n]=true;clearTimeout(relT[n]);if(!st.p[n]){st.p[n]=true;downAt[n]=performance.now();sfxBtn(true);settle();}}
function release(n){down[n]=false;if(paused){relPend[n]=true;return;}var w=Math.max(0,260-(performance.now()-(downAt[n]||0)));clearTimeout(relT[n]);
 relT[n]=setTimeout(function(){if(!down[n]){st.p[n]=false;sfxBtn(false);settle();}},w);}
function bindPB(){pbEls.forEach(function(g){var n=g.getAttribute('data-pb');
 g.addEventListener('pointerdown',function(e){e.preventDefault();try{g.setPointerCapture(e.pointerId);}catch(x){}press(n);});
 ['pointerup','pointercancel'].forEach(function(t){g.addEventListener(t,function(){release(n);});});
 g.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.repeat){e.preventDefault();press(n);}});
 g.addEventListener('keyup',function(e){if(e.key==='Enter'){release(n);}});});}
var KEYS={a:'OFF',s:'ON'};
function typing(e){var t=e.target&&e.target.tagName;return t==='INPUT'||t==='SELECT';}
document.addEventListener('keydown',function(e){
 if(e.key===' '&&!typing(e)){e.preventDefault();if(!e.repeat){setPaused(!paused);}return;}
 if(e.ctrlKey||e.metaKey||e.altKey||e.repeat){return;}var n=KEYS[e.key.toLowerCase()];if(n){press(n);}});
document.addEventListener('keyup',function(e){if(e.key===' '&&!typing(e)){e.preventDefault();return;}var n=KEYS[e.key.toLowerCase()];if(n){release(n);}});
function setPaused(v){paused=v;document.body.classList.toggle('paused',v);$('pausePill').hidden=!v;
 $('btnPause').textContent=v?'繼續(空白鍵)':'暫停(空白鍵)';$('btnPause').setAttribute('aria-pressed',v?'true':'false');
 if(AC){if(v){AC.suspend();}else if(!document.hidden){AC.resume();}}
 if(!v){Object.keys(relPend).forEach(function(n){delete relPend[n];release(n);});}syncBuzz();settle();}
$('btnPause').addEventListener('click',function(){setPaused(!paused);});
$('btnPower').addEventListener('click',function(){sfxSel();st.power=!st.power;settle();});
$('btnTrip').addEventListener('click',function(){if(st.power){st.tripped=true;settle();}});

$('btnReset').addEventListener('click',function(){setPaused(false);st.power=true;st.tripped=false;st.d=false;st.t=0;st.brk=0;
 Object.keys(st.c).forEach(function(k){st.c[k]=false;});Object.keys(st.p).forEach(function(k){st.p[k]=false;down[k]=false;});settle();});
$('chkFlow').addEventListener('change',function(e){st.flow=e.target.checked;settle();});
$('sT').addEventListener('change',function(){var i=$('sT'),v=parseFloat(i.value);if(!isFinite(v)){v=3;}v=Math.min(10,Math.max(1,Math.round(v*2)/2));i.value=v;setSec=v;settle();});
Object.keys(PAIRS).forEach(function(k){var b=document.createElement('button');b.className='btn';b.type='button';b.dataset.k=k;
 b.addEventListener('click',function(){meas=k;render(solve());});$('mbtns').appendChild(b);});

/* ---- 聲音(Web Audio 合成) ---- */
var AC=null,snd=true,master=null,wantBuzz=false,buzz=null;
function unlockAudio(){if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C){return;}AC=new C();var cp=AC.createDynamicsCompressor();master=AC.createGain();master.gain.value=.9;master.connect(cp);cp.connect(AC.destination);}
 if(AC.state!=='running'&&!paused&&!document.hidden){AC.resume();}}
function tone(f,d,ty,g,t0,f2){if(!AC||!snd||paused){return;}var t=AC.currentTime+(t0||0),o=AC.createOscillator(),v=AC.createGain();
 o.type=ty;o.frequency.setValueAtTime(f,t);if(f2){o.frequency.exponentialRampToValueAtTime(f2,t+d);}v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(master);o.start(t);o.stop(t+d+.02);}
function noise(d,g,fc,t0){if(!AC||!snd||paused){return;}var n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0),i;for(i=0;i<n;i++){a[i]=Math.random()*2-1;}
 var s=AC.createBufferSource(),f=AC.createBiquadFilter(),v=AC.createGain(),t=AC.currentTime+(t0||0);s.buffer=b;f.type='bandpass';f.frequency.value=fc;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(v);v.connect(master);s.start(t);}
function sfxBtn(dn){noise(.03,dn?.5:.25,3000);tone(dn?1200:900,.04,'square',dn?.12:.06,0,400);}
function sfxSel(){tone(220,.09,'triangle',.3,0,110);noise(.04,.3,800);}
function sfxMC(on,k,dl){var p=[1,.88,.78][k]*(1+(Math.random()-.5)*.04),g=on?1:.5;noise(.03,.7*g,2500*p,dl);tone((on?140:110)*p,on?.14:.08,'sine',.6*g,dl,60*p);tone(900*p,.03,'square',.15*g,dl);if(on){noise(.06,.3,600*p,dl+.05);}}
function sfxCoil(k,on,dl){if(k==='MC'){sfxMC(on,0,dl);}else if(k==='MCY'){sfxMC(on,1,dl);}else if(k==='MCD'){sfxMC(on,2,dl);}}
function syncBuzz(){var want=wantBuzz&&snd&&!paused&&!!AC;
 if(want&&!buzz){var o=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain();o.type='square';o.frequency.value=2700;lp.type='lowpass';lp.frequency.value=5000;g.gain.value=0;
  o.connect(lp);lp.connect(g);g.connect(master);o.start();g.gain.setTargetAtTime(.07,AC.currentTime,.02);buzz={o:o,g:g};}
 else if(!want&&buzz){var b=buzz;buzz=null;b.g.gain.setTargetAtTime(0,AC.currentTime,.04);b.o.stop(AC.currentTime+.25);}}
$('btnSnd').addEventListener('click',function(){snd=!snd;this.setAttribute('aria-pressed',snd?'true':'false');this.textContent=snd?'聲音:開':'聲音:關';if(snd){unlockAudio();sfxMC(true,0,0);}syncBuzz();});
document.addEventListener('pointerdown',unlockAudio,true);document.addEventListener('keydown',unlockAudio,true);
/* iOS 音效修正:①手機靜音鍵會讓 Web Audio 無聲,改播一段靜音 audio 元素讓系統走「播放」類別;②iOS 只認 touchend/click 當解鎖手勢 */
function iosAudioFix(getCtx){
  try{if(navigator.audioSession){navigator.audioSession.type='playback';}}catch(e){}
  var el=null;
  function silentWav(){
    var n=4000,b=new ArrayBuffer(44+n*2),v=new DataView(b);
    function s(o,t){for(var i=0;i<t.length;i++){v.setUint8(o+i,t.charCodeAt(i));}}
    s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*2,true);
    return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
  }
  function go(){
    var c=getCtx();
    if(c){try{var s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0);}catch(e){}}
    if(!el){try{el=document.createElement('audio');el.src=silentWav();el.loop=true;el.setAttribute('playsinline','');}catch(e){el=null;return;}}
    if(el.paused){var p=el.play();if(p&&p.catch){p.catch(function(){});}}
  }
  ['touchend','pointerup','click'].forEach(function(t){document.addEventListener(t,function(){unlockAudio();go();},true);});
  document.addEventListener('visibilitychange',function(){if(!el){return;}if(document.hidden){el.pause();}else{go();}});
}
iosAudioFix(function(){return AC;});

document.addEventListener('visibilitychange',function(){if(!AC){return;}if(document.hidden){AC.suspend();}else if(!paused){AC.resume();}});

buildCtl();buildMain(1);bindPB();fillTab();settle();
})();

/* 每張卡片右上角加收合鈕;沒有標題的卡片自動補標題 */
(function(){
  'use strict';
  function init(card){
    if(card.querySelector(':scope > .cbtn')){return;}
    var h=card.querySelector(':scope > h2, :scope > h3');
    if(!h){
      h=document.createElement('h2');h.className='xh';
      h.textContent=card.getAttribute('aria-label')||(card.classList.contains('controls')?'操作':'控制電路');
      card.insertBefore(h,card.firstChild);
    }
    var name=(h.textContent||'').replace(/【.*?】/g,'').trim()||'此區塊';
    var b=document.createElement('button');
    b.type='button';b.className='cbtn';
    b.innerHTML='<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path d="M3.5 6h11L9 13z" fill="currentColor"/></svg>';
    function sync(){
      var c=card.classList.contains('collapsed');
      b.setAttribute('aria-expanded',c?'false':'true');
      b.setAttribute('aria-label',(c?'展開':'收合')+'「'+name+'」');
      b.title=(c?'展開':'收合')+name;
    }
    function toggle(){card.classList.toggle('collapsed');sync();}
    b.addEventListener('click',toggle);
    /* 空白鍵在鈕上用來收合,不要觸發頁面的暫停 */
    b.addEventListener('keydown',function(e){if(e.key===' '){e.preventDefault();e.stopPropagation();if(!e.repeat){toggle();}}});
    b.addEventListener('keyup',function(e){if(e.key===' '){e.preventDefault();e.stopPropagation();}});
    h.addEventListener('click',toggle);
    card.classList.add('collapsible');
    card.appendChild(b);sync();
  }
  function all(){Array.prototype.forEach.call(document.querySelectorAll('.card'),init);}
  all();
})();
</script>
