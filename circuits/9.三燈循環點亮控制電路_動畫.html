<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三燈循環點亮控制電路動畫</title>
<style>
:root{color-scheme:light}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
body{margin:0}[hidden]{display:none!important}
:root{--bg:#f2f5f8;--panel:#fff;--ink:#18212d;--muted:#556172;--line:#d3dbe5;--wire:#3a3a3a;--dot:#111;--lbl:#222;--term:#cde8f5;--tint:#cde8f5;--on:#d8352a;--flow:#ee8a22;--accent:#1d5fa6;--onaccent:#fff;
--font:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--panel:#18202a;--ink:#e8edf3;--muted:#9aa7b8;--line:#2b3643;--wire:#b6c1ce;--dot:#e8edf3;--lbl:#e8edf3;--term:#2d5167;--tint:#26475a;--on:#ff5547;--flow:#ffb04d;--accent:#6aa9ee;--onaccent:#0c1218}}
:root[data-theme="dark"]{--bg:#10151b;--panel:#18202a;--ink:#e8edf3;--muted:#9aa7b8;--line:#2b3643;--wire:#b6c1ce;--dot:#e8edf3;--lbl:#e8edf3;--term:#2d5167;--tint:#26475a;--on:#ff5547;--flow:#ffb04d;--accent:#6aa9ee;--onaccent:#0c1218}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
.wrap{max-width:1280px;margin:0 auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.25rem;line-height:1.3;margin:0 0 4px;font-weight:700}
.sub{margin:0 0 10px;color:var(--muted);font-size:.88rem}
h2{font-size:.8rem;letter-spacing:.08em;margin:0 0 8px;color:var(--muted);font-weight:500}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.fig{padding:8px;text-align:center}
.controls .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.btn{font:inherit;padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer;min-height:40px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:focus-visible,.switch input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.tm{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px}
.tm label{display:flex;align-items:center;gap:6px}
.tm input{width:4.6em;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.tm input:disabled{opacity:.45}
.warn{color:var(--on);font-size:.85rem;margin:0}
.hint{margin:6px 0 0;color:var(--muted);font-size:.82rem}
.lower{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.lower{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.chips{list-style:none;margin:0 0 10px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.chips li{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;font-size:.85rem}
.chips i{width:11px;height:11px;border-radius:50%;background:var(--line);flex:none}
.chips li.on{border-color:var(--c)}.chips li.on i{background:var(--c)}
.chips b{margin-left:auto;font-weight:500;color:var(--muted)}.chips li.on b{color:var(--ink)}
.msg-title{font-weight:700;margin:0 0 2px}.msg{margin:0;min-height:3.2em;font-size:.9rem}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:.85rem}
.legend li{display:flex;gap:10px;align-items:center}.legend svg{flex:none}
#fig{display:block;width:100%;height:auto;max-height:max(300px,calc(100vh - 492px));margin:0 auto}
.lb{font:14px Arial,Helvetica,sans-serif;fill:var(--lbl)}.lb.sm{font-size:12px}.lb.big{font-size:16px}
.w{fill:none;stroke:var(--wire);stroke-width:1.5;stroke-linejoin:miter}
.w.hot{stroke:var(--flow);stroke-width:2.8;stroke-dasharray:7 5;animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.dot{fill:var(--dot)}
.term{fill:var(--term);stroke:var(--wire);stroke-width:1.5}
.pl{stroke:var(--wire);stroke-width:3}.sl{stroke:var(--wire);stroke-width:2.2}
.ct .fillb,.ct .outb{display:none}
.ct.act .pl,.ct.act .sl{display:none}
.ct.act:not(.nc) .fillb{display:inline;fill:var(--on);stroke:none}
.ct.act.nc .outb{display:inline;fill:none;stroke:var(--on);stroke-width:2.6}
.barl{stroke:var(--wire);stroke-width:3}.lever{stroke:var(--wire);stroke-width:2.2}
.pb{cursor:pointer;outline:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.pb .bar{transition:transform .1s}
.pb:not(.nc).pressed .bar{transform:translateX(-11.6px)}
.pb.nc.pressed .bar{transform:translateX(-10px)}
.pb.pressed .barl,.pb.pressed .lever{stroke:var(--on)}
.pb.pressed .lb{fill:var(--on);font-weight:700}
.pb .hit{fill:transparent}
@media (hover:hover){.pb:hover .hit{fill:var(--accent);fill-opacity:.14}}
.pb:focus-visible .hit{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}
.fuse rect{fill:var(--tint);stroke:var(--wire);stroke-width:2.5}.fuse line{stroke:var(--wire);stroke-width:1.8}
.coil .body,.lamp .body{fill:var(--tint);stroke:var(--wire);stroke-width:1.8;transition:fill .12s}
.coil text,.lamp text{font:13px Arial,Helvetica,sans-serif;fill:var(--lbl);text-anchor:middle}
.coil.on .body{fill:var(--on)}.coil.on text{fill:#fff;font-weight:700}
.lamp .halo{fill:var(--hc);opacity:0;transition:opacity .12s}.lamp.on .halo{opacity:.4}
.lamp .ray{stroke:var(--wire);stroke-width:1.5}.lamp.on .ray{stroke:var(--rc);stroke-width:2.6}
.lamp.on .body{fill:var(--lc)}.lamp.on text{fill:var(--tc);font-weight:700}
.tk .tbar{transition:transform .1s}.tk .tbar line{stroke:var(--wire);stroke-width:3}
.tk .tbar polygon{fill:var(--panel);stroke:var(--wire);stroke-width:1.8}
.tk:not(.nc).act .tbar{transform:translateX(-7px)}.tk.nc.act .tbar{transform:translateX(7px)}
.tk.act .tbar line,.tk.act .tbar polygon,.tk.live .tbar line,.tk.live .tbar polygon{stroke:var(--on)}
.tk:not(.nc).act .tbar polygon,.tk.live .tbar polygon{fill:var(--on)}
.tk .tbar line.inbar{display:none}.tk.fr.act .tbar line.inbar{display:inline;stroke:#fff;stroke-width:2}
#pausePill{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:5;background:var(--accent);color:var(--onaccent);padding:4px 14px;border-radius:999px;font-size:.85rem}
body.paused .w.hot{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.w.hot{animation:none;stroke-dasharray:none}.pb .bar,.tk .tbar{transition:none}}
</style>
<style id="tsCss">
#tsCard{margin-bottom:12px}
.tsBar{display:flex;align-items:stretch;gap:10px}
.tsB{flex:none;width:46px;font-size:1.1rem;padding:0}
.tsMain{flex:1;min-width:0}
.tsMain p{margin:0}
.tsHead{font-weight:700;margin-bottom:2px!important}
.tsHead b{color:var(--accent);margin-right:10px;font-variant-numeric:tabular-nums}
.tsRow{display:flex;gap:8px;font-size:.92rem;line-height:1.5}
.tsRow i{flex:none;font-style:normal;color:var(--muted);min-width:2.6em}
.tsHead em{font-style:normal;color:var(--accent);margin-left:10px;font-weight:400;font-size:.85rem}
.tsCtl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:8px}
.tsCtl .btn{min-height:34px;padding:4px 12px}
.tsCtl .switch{margin:0;font-size:.88rem}
.tsDots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tsDots button{font:inherit;font-size:.78rem;min-width:30px;height:30px;padding:0 4px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--muted);cursor:pointer}
.tsDots button.v{background:color-mix(in srgb,var(--accent) 22%,var(--panel));color:var(--ink)}
.tsDots button.c{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.tsHl{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;animation:tsP 1.1s ease-in-out infinite}
.pb.tsHl{outline:none;animation:none}
.pb.tsHl .hit{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:5 3;fill:var(--accent);fill-opacity:.18}
@keyframes tsP{50%{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){.tsHl{animation:none}}
</style>
<style id="collapseCss">
/* 手機點按不出現黑底/灰底;按鈕與選擇開關不可選取文字 */
*{-webkit-tap-highlight-color:transparent}
.pb,.pb *,.sel,.sel *,.cosg,.cosg *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* 卡片右上角收合鈕(倒三角形,收合後轉向右) */
.card{position:relative}
.card>h2,.card>h3{padding-right:44px;text-align:left}
.card.collapsible>h2,.card.collapsible>h3{cursor:pointer}
.cbtn{position:absolute;top:2px;right:2px;z-index:2;width:36px;height:36px;padding:0;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (hover:hover){.cbtn:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}}
.cbtn:focus{outline:none}
.cbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cbtn svg{display:block;transition:transform .18s}
.card.collapsed>.cbtn svg{transform:rotate(-90deg)}
.card.collapsed{box-sizing:border-box;min-height:42px}
.card.collapsed>*:not(h2):not(h3):not(.cbtn){display:none!important}
.card.collapsed>h2,.card.collapsed>h3{display:block!important;margin:0!important}
@media (min-width:960px){
  .card.controls:not(.collapsed){padding-right:52px}
  .card.controls>h2.xh{display:none}
}
@media (prefers-reduced-motion:reduce){.cbtn svg{transition:none}}
</style>
<style id="floatCss">
#tsFloat{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:8}
#tsFloat[hidden]{display:none}
.tfBar{display:flex;align-items:center;gap:8px;padding:5px;border-radius:999px;background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.tfNav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:1rem;cursor:pointer;padding:0}
.tfNav:disabled{opacity:.4;cursor:not-allowed}
.tfNav:hover:not(:disabled){border-color:var(--accent)}
.tfBall{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--onaccent);cursor:grab;touch-action:none;display:grid;place-items:center;padding:0;font:inherit;line-height:1.1;-webkit-user-select:none;user-select:none}
.tfBall span{display:block;text-align:center}
.tfBall b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.tfBall small{display:block;font-size:.7rem;opacity:.85}
.tfBall.ps{background:var(--muted)}
.tfBall.run{animation:tfP 1.2s ease-in-out infinite}
@keyframes tfP{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 35%,transparent)}}
.tfBall:focus-visible,.tfNav:focus-visible,.tfX:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tfPanel{position:absolute;bottom:calc(100% + 8px);right:0;width:min(340px,calc(100vw - 24px));max-height:60vh;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 6px 22px rgba(0,0,0,.35)}
.tfPanel[hidden]{display:none}
#tsFloat.down .tfPanel{bottom:auto;top:calc(100% + 8px)}
#tsFloat.left .tfPanel{right:auto;left:0}
.tfPanel p{margin:0}
.tfHead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-weight:700;margin-bottom:4px}
.tfHead b{color:var(--accent);margin-right:8px;font-variant-numeric:tabular-nums}
.tfHead em{font-style:normal;color:var(--accent);margin-left:8px;font-weight:400;font-size:.85rem}
.tfX{flex:none;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;font-size:1rem}
.tfX:hover{color:var(--accent)}
.tfBtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tfBtns .btn{min-height:34px;padding:4px 10px;font-size:.88rem}
.tsCtl #tsAll[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.tfBall.run{animation:none}}
</style>
</head>
<body>
<div id="pausePill" hidden>已暫停</div>
<main class="wrap">
<h1>三燈循環點亮控制電路</h1>
<p class="sub">按 PB1 啟動,觀察 PL1、PL2、PL3 依序點亮並循環;按 PB2 停止。通電或動作的元件會變紅,線圈旁的數字是「已計時/設定」秒數。</p>

<section class="card tsCard" id="tsCard" aria-label="測試步驟">
<h2>測試步驟</h2>
<div class="tsBar"><button class="btn tsB" id="tsPrev" type="button" aria-label="上一步">◀</button>
<div class="tsMain" aria-live="polite"><p class="tsHead"><b id="tsNo"></b><span id="tsTitle"></span><em id="tsRun"></em></p>
<p class="tsRow"><i>操作</i><span id="tsDo"></span></p><p class="tsRow"><i>預期</i><span id="tsSee"></span></p></div>
<button class="btn tsB" id="tsNext" type="button" aria-label="下一步">▶</button></div>
<div class="tsCtl"><button class="btn" id="tsPlay" type="button">↻ 重播此步驟</button><button class="btn" id="tsAll" type="button" aria-pressed="false">▶ 從頭播放全部</button><button class="btn" id="tsFrom" type="button">▶ 從此步驟播放</button><label class="switch"><input type="checkbox" id="tsAuto" checked><span>切換步驟時自動執行(自動按鍵、等計時)</span></label></div>
<div class="tsDots" id="tsDots" role="group" aria-label="步驟清單"></div>
</section>
<div id="tsFloat" hidden>
<div class="tfPanel" id="tfPanel" role="region" aria-label="測試步驟(浮動視窗)" hidden>
<div class="tfHead"><span><b id="tfStep"></b><span id="tfTitle"></span><em id="tfRun"></em></span><button type="button" class="tfX" id="tfClose" aria-label="收起步驟視窗">✕</button></div>
<p class="tsRow"><i>操作</i><span id="tfDo"></span></p><p class="tsRow"><i>預期</i><span id="tfSee"></span></p>
<div class="tfBtns"><button class="btn" id="tfAll" type="button">▶ 從頭播放全部</button><button class="btn" id="tfFrom" type="button">▶ 從此步驟播放</button><button class="btn" id="tfRe" type="button">↻ 重播此步驟</button><button class="btn" id="tfPause" type="button">⏸ 暫停</button></div>
</div>
<div class="tfBar"><button class="tfNav" id="tfPrev" type="button" aria-label="上一步">◀</button><button class="tfBall" id="tfBall" type="button" aria-expanded="false" aria-label="展開或收起測試步驟,可拖曳移動"><span><b id="tfNo">1</b><small id="tfTot">/17</small></span></button><button class="tfNav" id="tfNext" type="button" aria-label="下一步">▶</button></div>
</div>

<section class="card controls" aria-label="操作">
<div class="row">
<button class="btn" id="btnPause" type="button" aria-pressed="false">暫停(空白鍵)</button>
<button class="btn" id="btnPower" type="button" aria-pressed="true">送電中</button>
<button class="btn" id="btnReset" type="button">全部重設</button>
<label class="switch" for="chkFlow"><input type="checkbox" id="chkFlow"><span>顯示電流路徑</span></label>
<button class="btn" id="btnSnd" type="button" aria-pressed="true">聲音:開</button>
</div>
<div class="tm">
<label for="sTR1">TR1 <input type="number" id="sTR1" min="1" max="10" step="0.5" value="1"> 秒</label>
<label for="sTR2">TR2 <input type="number" id="sTR2" min="1" max="10" step="0.5" value="2"> 秒</label>
<label for="sTR3">TR3 <input type="number" id="sTR3" min="1" max="10" step="0.5" value="6"> 秒</label>
<p class="warn" id="warn"></p>
</div>
<p class="hint">按住滑鼠或手指按下按鈕,放開後彈回。鍵盤:a = PB1(啟動)、s = PB2(停止)、空白鍵 = 暫停。線圈通電時不能修改秒數。</p>
</section>

<div class="card fig">
<svg id="fig" viewBox="0 16 1290 464" role="img" aria-label="三燈循環點亮控制電路圖,含 PB1、PB2、MC、TR1 到 TR3、FR 與 PL1 到 PL3">
<g id="wires"></g><g id="dots"></g><g id="parts"></g><g id="labels"></g>
</svg>
</div>

<div class="lower">
<section class="card status" aria-label="目前狀態">
<h2 id="stH">目前狀態</h2>
<ul class="chips" id="chips"></ul>
<div aria-live="polite"><p class="msg-title" id="msgTitle"></p><p class="msg" id="msgBody"></p></div>
</section>
<section class="card legend" aria-label="圖例">
<h2>圖例</h2>
<ul>
<li><svg width="34" height="16" aria-hidden="true"><circle cx="17" cy="8" r="7" fill="var(--on)"/></svg><span>紅色圓圈:線圈通電;紅色按鈕:被按下</span></li>
<li><svg width="34" height="16" aria-hidden="true"><rect x="3" y="2" width="28" height="12" fill="var(--on)"/></svg><span>紅色塗滿:閉合的常開接點</span></li>
<li><svg width="34" height="16" aria-hidden="true"><polygon points="8,2 8,14 24,8" fill="var(--panel)" stroke="var(--wire)" stroke-width="1.8"/></svg><span>三角形:限時接點(通電延遲);菱形:FR 閃爍接點</span></li>
<li><svg width="34" height="16" aria-hidden="true"><line x1="3" y1="8" x2="31" y2="8" stroke="var(--flow)" stroke-width="2.8" stroke-dasharray="7 5"/></svg><span>橘色流動線:電流經過的路徑</span></li>
</ul>
</section>
</div>
</main>

<script>
(function(){'use strict';
var NS='http://www.w3.org/2000/svg',$=function(i){return document.getElementById(i);};
var svg=$('fig'),gW=svg.querySelector('#wires'),gD=svg.querySelector('#dots'),gP=svg.querySelector('#parts'),gL=svg.querySelector('#labels');
var st={power:true,flow:false,p:{PB1:false,PB2:false},c:{MC:false,TR1:false,TR2:false,TR3:false,FR:false},d:{TR1:false,TR2:false,TR3:false},t:{TR1:0,TR2:0,TR3:0},f:false,ft:0};
var setSec={TR1:1,TR2:2,TR3:6};
var edges=[],loads=[],acts=[],pbEls=[],coilEls={},lampEls={},tms={};

/* ---- 繪圖輔助 ---- */
function el(tag,a,parent){var e=document.createElementNS(NS,tag);for(var k in a){e.setAttribute(k,a[k]);}if(parent){parent.appendChild(e);}return e;}
function txt(x,y,s,cls,anchor){var t=el('text',{x:x,y:y,'class':cls||'lb'},gL);if(anchor){t.setAttribute('text-anchor',anchor);}t.textContent=s;return t;}
function wire(a,b,d){var p=el('path',{d:d,'class':'w'},gW);edges.push({a:a,b:b,el:p,on:function(){return true;}});}
function swi(a,b,fn){edges.push({a:a,b:b,on:fn});}
function load(a,b,key){loads.push({a:a,b:b,key:key});}
function dot(x,y){el('circle',{cx:x,cy:y,r:3.5,'class':'dot'},gD);}
function contact(cx,y1,y2,hw,o){
  var g=el('g',{'class':'ct'+(o.slash?' nc':'')},gP);
  el('rect',{x:cx-hw,y:y1-1.5,width:2*hw,height:(y2-y1)+3,'class':'fillb'},g);
  el('rect',{x:cx-hw,y:y1,width:2*hw,height:(y2-y1),'class':'outb'},g);
  el('line',{x1:cx-hw,y1:y1,x2:cx+hw,y2:y1,'class':'pl'},g);

/* ---- 求解 ---- */
function solve(){
  var adj={},i,e;
  for(i=0;i<edges.length;i++){e=edges[i];if(!e.on()){continue;}(adj[e.a]=adj[e.a]||[]).push([e.b,e]);(adj[e.b]=adj[e.b]||[]).push([e.a,e]);}
  function reach(seed){var s={},q=[seed];s[seed]=true;while(q.length){var n=q.pop(),l=adj[n]||[];for(var j=0;j<l.length;j++){if(!s[l[j][0]]){s[l[j][0]]=true;q.push(l[j][0]);}}}return s;}
  var rnet=st.power?reach('R0'):{},tnet=reach('T0'),on={},hot=new Set();
  function paths(from,to){var seen={},stack=[];seen[from]=true;
    (function dfs(n){if(n===to){stack.forEach(function(x){hot.add(x);});return;}
      var l=adj[n]||[];for(var j=0;j<l.length;j++){var m=l[j][0];if(seen[m]){continue;}seen[m]=true;stack.push(l[j][1]);dfs(m);stack.pop();seen[m]=false;}})(from);}
  loads.forEach(function(L){var f=false,ra=null,tb=null;
    if(rnet[L.a]&&tnet[L.b]){f=true;ra=L.a;tb=L.b;}else if(rnet[L.b]&&tnet[L.a]){f=true;ra=L.b;tb=L.a;}
    on[L.key]=f;if(f){paths('R0',ra);paths(tb,'T0');}});
  return {on:on,hot:hot,rnet:rnet};
}

  snd=!snd;this.setAttribute('aria-pressed',snd?'true':'false');this.textContent=snd?'聲音:開':'聲音:關';
  if(snd){unlockAudio();sfxMC(true,0);}
});
document.addEventListener('pointerdown',unlockAudio,true);document.addEventListener('keydown',unlockAudio,true);
/* iOS 音效修正:①手機靜音鍵會讓 Web Audio 無聲,改播一段靜音 audio 元素讓系統走「播放」類別;②iOS 只認 touchend/click 當解鎖手勢 */
function iosAudioFix(getCtx){
  try{if(navigator.audioSession){navigator.audioSession.type='playback';}}catch(e){}
  var el=null;
  function silentWav(){
    var n=4000,b=new ArrayBuffer(44+n*2),v=new DataView(b);
    function s(o,t){for(var i=0;i<t.length;i++){v.setUint8(o+i,t.charCodeAt(i));}}
    s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*2,true);
    return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
  }
  function go(){
    var c=getCtx();
    if(c){try{var s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0);}catch(e){}}
    if(!el){try{el=document.createElement('audio');el.src=silentWav();el.loop=true;el.setAttribute('playsinline','');}catch(e){el=null;return;}}
    if(el.paused){var p=el.play();if(p&&p.catch){p.catch(function(){});}}
  }
  ['touchend','pointerup','click'].forEach(function(t){document.addEventListener(t,function(){unlockAudio();go();},true);});
  document.addEventListener('visibilitychange',function(){if(!el){return;}if(document.hidden){el.pause();}else{go();}});
}
iosAudioFix(function(){return AC;});

document.addEventListener('visibilitychange',function(){if(!AC){return;}if(document.hidden){AC.suspend();}else if(!paused){AC.resume();}});

build();bindPB();settle();
})();

<script id="tsJs">
(function(){'use strict';
var CFG={"tabs": null, "ids": {"pause": "btnPause", "flow": "chkFlow", "snd": "btnSnd", "pwr": "btnPower", "rst": "btnReset"}, "steps": {"": [["待機", "按「全部重設」，PB1、PB2 都沒按。", "MC、TR1～TR3、FR 都沒通電，PL1～PL3 全熄。", ["rst"], ""], ["按 PB1：PL1 亮", "按 PB1（鍵盤 a）再放開（示範時 TR1 先設 3 秒，方便觀察）。", "MC 通電並自保持，TR1 開始計時，PL1 亮。", ["PB1", "#sTR1"], "S #sTR1 3;P PB1;W 600"], ["TR1 計時完成：PL2 亮", "承上步（TR1 為預設 1 秒），等 TR1 計時完成。", "TR1 接點動作：PL1 熄、PL2 亮，TR2、TR3 開始計時。", ["#sTR1"], "P PB1;WI #sTR1"], ["TR2 計時完成：PL3 閃亮", "承上步，再等 TR2 計時完成。", "PL2 熄，FR 動作，PL3 開始閃亮（FR 約每 0.5 秒切換一次）。", ["#sTR2"], "P PB1;WI #sTR1;WI #sTR2"], ["TR3 計時完成：回到 PL1", "承上步，TR1 先改設 3 秒（讓回到 PL1 的畫面停留久一點），等到 TR3 計時完成（約 9 秒）。", "TR1、TR2、TR3、FR 全部斷電，PL3 熄，TR1 重新計時，PL1 再亮。", ["#sTR1", "#sTR3"], "S #sTR1 3;P PB1;W 10100"], ["循環持續", "承上步，再等約 1 秒到第二輪。", "又進入 PL2 亮的階段；只要不按 PB2，三盞燈就一直照 PL1 → PL2 → PL3 循環。", [], "P PB1;W 8400"], ["按 PB2 停止", "運轉中按 PB2（鍵盤 s）。", "MC 與所有電驛斷電，三盞燈全熄；要重新按 PB1。", ["PB2"], "P PB1;W 1200;P PB2;W 900"], ["時間設定警告", "把 TR2 設成 6 秒（不小於 TR3），再按 PB1。", "畫面出現「注意:設定時間要 TR2 小於 TR3,否則 PL3 不會閃亮。」的提醒；TR2 到時 TR3 也到，PL3 不會閃亮。", ["#sTR2"], "S #sTR2 6;P PB1;W 800"], ["秒數鎖定", "按 PB1 後點 TR1 秒數欄；再按 PB2 後再點一次。", "線圈通電時該欄位停用，按 PB2 斷電後恢復，可改 1～10 秒。", ["#sTR1"], "P PB1;W 600"], ["斷電（送電鈕）", "運轉中按「送電中」鈕切成「已斷電」。", "全部熄滅；再按一次恢復送電，要重新按 PB1。", ["pwr"], "P PB1;W 600;C pwr;W 900"]]}, "cs": {"": ["P PB1", ""]}, "init": "S #sTR1 1;S #sTR2 2;S #sTR3 6", "take": ".pb,#btnPower,#btnReset,#sTR1,#sTR2,#sTR3", "keys": ["a", "s"]};
var $=function(i){return document.getElementById(i);};
var idx=0,key=null,seen={},list=[];
function curKey(){if(!CFG.tabs){return '';}for(var i=0;i<CFG.tabs.length;i++){var b=$(CFG.tabs[i]);if(b&&b.getAttribute('aria-pressed')==='true'){return CFG.tabs[i];}}return CFG.tabs[0];}
function common(){var cs=CFG.cs[key]||CFG.cs[''];return [
['共通:暫停與繼續','按空白鍵(或「暫停」鈕)。','出現「已暫停」:計時數字、流動線、馬達與蜂鳴聲都凍結,按鈕與送電、OL 鈕停用;再按一次從原進度繼續。',['pause'],cs[0]+';W 1500;SPACE;W 2000;SPACE'+(cs[1]?';'+cs[1]:'')],
['共通:電流路徑與聲音','勾選「顯示電流路徑」並操作一次;再按「聲音」鈕開關。','橘色流動線只出現在有電流經過的導線,死路不變色;聲音「開」時按鈕與 MC 動作有聲,「關」後不再發聲(第一次點擊或按鍵後才有聲音)。',['flow','snd'],cs[0]+';K flow 1;W 2500'+(cs[1]?';'+cs[1]:'')]];}
function build(){
  key=curKey();list=(CFG.steps[key]||[]).concat(common());idx=0;seen={};
  var d=$('tsDots');d.innerHTML='';
  list.forEach(function(s,i){var b=document.createElement('button');b.type='button';b.textContent=i+1;b.title=s[0];b.setAttribute('aria-label','第 '+(i+1)+' 步:'+s[0]);b.addEventListener('click',function(){go(i);});d.appendChild(b);});
  show();
}

var runId=0,running=false,allOn=false,allTok=0,runMsg='',sPause=false,jump=-1;   /* jump:全部播放中要改跳去的步驟(-1 表示沒有) */
function bodyPaused(){return document.body.classList.contains('paused');}
/* 只有使用者按下的暫停才凍結腳本;步驟「暫停與繼續」自己示範的暫停(sPause)不凍結,否則會卡死 */
function frozen(){return bodyPaused()&&!sPause;}
function sl(ms){return new Promise(function(r){var left=ms,last=performance.now(),my=runId;(function tick(){if(runId!==my){r();return;}var n=performance.now();if(!frozen()){left-=n-last;}last=n;if(left<=0){r();}else{setTimeout(tick,Math.min(50,Math.max(10,left)));}})();});}
function hold(run){return new Promise(function(r){(function w(){if(frozen()&&run()){setTimeout(w,80);}else{r();}})();});}
function pe(el,t){try{el.dispatchEvent(new PointerEvent(t,{bubbles:true,cancelable:true,pointerId:1,pointerType:'mouse',isPrimary:true}));}catch(x){}}
function one(q){return targets(q)[0];}
function clk(e){if(typeof e.click==='function'){e.click();}else{e.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));}}
function parts(sc){return sc.split(';').map(function(x){return x.trim();}).filter(Boolean);}

function showRun(){
  var t=runMsg,ps=bodyPaused()&&!sPause;
  if(running||allOn){t=ps?'已暫停':(allOn?'全部播放中…':'執行中…');}
  if($('tsRun').textContent!==t){$('tsRun').textContent=t;}
  updFloat();
}
function updAll(){
  var t=allOn?'■ 停止全部播放':'▶ 從頭播放全部';
  $('tsAll').textContent=t;$('tfAll').textContent=t;
  $('tsAll').setAttribute('aria-pressed',allOn?'true':'false');
  $('tsFrom').disabled=allOn;$('tfFrom').disabled=allOn;
}
function stopRun(){runId++;running=false;if(sPause){sPause=false;if(bodyPaused()){var b=$(CFG.ids.pause);if(b){b.click();}}}}
function stopAll(){jump=-1;if(allOn){allOn=false;allTok++;updAll();}}
function fail(x){running=false;allOn=false;allTok++;updAll();runMsg='執行失敗:'+(x&&x.message||x);showRun();}

async function exec(sc,id){
  var run=function(){return id===runId;};
  running=true;runMsg='執行中…';sPause=false;showRun();
  var cmds=parts('R;'+(CFG.init||'')+';'+sc);
  for(var i=0;i<cmds.length&&run();i++){
    await hold(run);if(!run()){break;}
    var a=cmds[i].split(' '),c=a[0],e;
    if(c==='R'){e=one('rst');if(e){clk(e);}await sl(450);}
    else if(c==='P'){e=one(a[1]);if(e){pe(e,'pointerdown');await sl(320);pe(e,'pointerup');}await sl(450);}
    else if(c==='D'){e=one(a[1]);if(e){pe(e,'pointerdown');}await sl(150);}
    else if(c==='U'){e=one(a[1]);if(e){pe(e,'pointerup');}await sl(400);}
    else if(c==='C'){e=one(a[1]);if(e){clk(e);}await sl(500);}
    else if(c==='W'){await sl(+a[1]);}
    else if(c==='WI'){e=one(a[1]);await sl(((e&&parseFloat(e.value))||3)*1000+600);}
    else if(c==='S'){e=one(a[1]);if(e&&!e.disabled){e.value=a[2];e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));}await sl(150);}
    else if(c==='K'){e=one(a[1]);if(e&&e.checked!==(a[2]==='1')){clk(e);}await sl(200);}
    else if(c==='CI'){e=one(a[1]);if(e&&e.textContent.indexOf(a[2])>=0){clk(e);}await sl(300);}
    else if(c==='CT'){var bs=document.querySelectorAll('button');for(var k=0;k<bs.length;k++){if(bs[k].textContent.indexOf(a[1])>=0){clk(bs[k]);break;}}await sl(400);}
    else if(c==='SPACE'){
      if(!sPause){sPause=true;}else{sPause=false;}
      ['keydown','keyup'].forEach(function(t){document.dispatchEvent(new KeyboardEvent(t,{key:' ',bubbles:true}));});await sl(300);}
  }
  var ok=run();
  if(ok){running=false;runMsg='已執行完';sPause=false;showRun();}
  return ok;
}
/* 重播此步驟:全部播放中不中斷播放,取消目前這一步後從同一步重跑,跑完照常進入下一步;沒在全部播放時只跑這一步 */
function play(){
  if(allOn){jumpTo(idx);return;}
  stopRun();var s=list[idx];if(!s){return;}runId++;exec(s[4]||'',runId).catch(fail);
}
/* 全部播放中跳到指定步驟(重播、上一步、下一步、點步驟編號):取消目前腳本,迴圈改到該步重跑,之後繼續往後播 */
function jumpTo(i){jump=i;stopRun();}
/* 從第 from 步開始播放到最後一步;每步結束停 2.5 秒讓人看結果;暫停鍵可暫停;自己動手操作電路才會停止 */
async function runAll(from){
  stopRun();allOn=true;var tok=++allTok;jump=-1;updAll();idx=from;
  try{
    while(allOn&&tok===allTok){
      show();runId++;var id=runId;
      var ok=await exec(list[idx][4]||'',id);
      if(!allOn||tok!==allTok){return;}
      if(jump>=0){idx=jump;jump=-1;continue;}
      if(!ok){break;}
      if(idx>=list.length-1){allOn=false;allTok++;updAll();runMsg='全部播放完畢';showRun();return;}
      for(var left=2500;left>0&&jump<0;left-=100){await sl(100);if(!allOn||tok!==allTok){return;}}
      if(jump>=0){idx=jump;jump=-1;continue;}
      idx++;
    }
  }catch(x){fail(x);return;}
  if(allOn&&tok===allTok){allOn=false;allTok++;updAll();showRun();}
}
function toggleAll(){if(allOn){stopRun();stopAll();runMsg='已停止全部播放';showRun();}else{runAll(0);}}
function playFrom(){if(!allOn){runAll(idx);}}
function go(i){
  idx=Math.max(0,Math.min(list.length-1,i));show();
  if(allOn){jumpTo(idx);return;}
  if($('tsAuto').checked){play();}else{stopRun();runMsg='';showRun();}
}
function show(){
  var s=list[idx];seen[idx]=true;
  $('tsNo').textContent='步驟 '+(idx+1)+'/'+list.length;$('tsTitle').textContent=s[0];
  $('tsDo').textContent=s[1];$('tsSee').textContent=s[2];
  $('tsPrev').disabled=idx===0;$('tsNext').disabled=idx===list.length-1;
  Array.prototype.forEach.call($('tsDots').children,function(b,i){b.className=i===idx?'c':(seen[i]?'v':'');});
  apply();updFloat();
}
function targets(t){var I=CFG.ids,q;
  if(I[t]){q='#'+I[t];}else if(t.charAt(0)==='#'||t.charAt(0)==='['){q=t;}else{q='[data-pb="'+t+'"]';}
  try{return Array.prototype.slice.call(document.querySelectorAll(q));}catch(e){return [];}}
function apply(){
  Array.prototype.forEach.call(document.querySelectorAll('.tsHl'),function(e){e.classList.remove('tsHl');});
  var s=list[idx];if(!s){return;}
  s[3].forEach(function(t){targets(t).forEach(function(e){(e.closest&&e.tagName==='INPUT'&&e.closest('label')||e).classList.add('tsHl');});});
}

/* ---- 浮動步驟球:步驟卡片捲出畫面時出現,點球展開文字,球旁有上一步/下一步 ---- */
var fl=$('tsFloat'),fp=$('tfPanel'),fb=$('tfBall'),openP=false,cardVis=true;
function updFloat(){
  var s=list[idx];if(!s){return;}
  $('tfNo').textContent=idx+1;$('tfTot').textContent='/'+list.length;
  $('tfStep').textContent='步驟 '+(idx+1)+'/'+list.length;$('tfTitle').textContent=s[0];
  $('tfDo').textContent=s[1];$('tfSee').textContent=s[2];$('tfRun').textContent=$('tsRun').textContent;
  $('tfPrev').disabled=idx===0;$('tfNext').disabled=idx===list.length-1;
  var ps=bodyPaused();
  $('tfPause').textContent=ps?'▶ 繼續':'⏸ 暫停';
  fb.classList.toggle('run',(running||allOn)&&!ps);fb.classList.toggle('ps',ps);
}
function setOpen(v){
  openP=v;fp.hidden=!v;fb.setAttribute('aria-expanded',v?'true':'false');
  if(v){var r=fl.getBoundingClientRect();fl.classList.toggle('down',r.top<320);fl.classList.toggle('left',r.left+r.width/2<innerWidth/2);}
}
function applyFloat(){fl.hidden=cardVis;if(cardVis&&openP){setOpen(false);}}
if('IntersectionObserver' in window){
  new IntersectionObserver(function(es){cardVis=es[es.length-1].intersectionRatio>=0.6;applyFloat();},{threshold:[0,.2,.4,.6,.8,1]}).observe($('tsCard'));
}
(function(){
  var sx=0,sy=0,ox=0,oy=0,moved=false,drag=false;
  fb.addEventListener('pointerdown',function(e){drag=true;moved=false;sx=e.clientX;sy=e.clientY;var r=fl.getBoundingClientRect();ox=r.left;oy=r.top;try{fb.setPointerCapture(e.pointerId);}catch(x){}});
  fb.addEventListener('pointermove',function(e){
    if(!drag){return;}var dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.abs(dx)+Math.abs(dy)<8){return;}moved=true;
    var w=fl.offsetWidth,h=fl.offsetHeight;
    fl.style.left=Math.max(4,Math.min(innerWidth-w-4,ox+dx))+'px';fl.style.top=Math.max(4,Math.min(innerHeight-h-4,oy+dy))+'px';
    fl.style.right='auto';fl.style.bottom='auto';
  });
  fb.addEventListener('pointerup',function(){var m=moved;drag=false;if(m){if(openP){setOpen(true);}}else{setOpen(!openP);}});
  fb.addEventListener('pointercancel',function(){drag=false;});
  fb.addEventListener('click',function(e){if(e.detail===0){setOpen(!openP);}});   /* 鍵盤 Enter */
})();
$('tfClose').addEventListener('click',function(){setOpen(false);});
$('tfPrev').addEventListener('click',function(){go(idx-1);});
$('tfNext').addEventListener('click',function(){go(idx+1);});
$('tfAll').addEventListener('click',toggleAll);
$('tfFrom').addEventListener('click',playFrom);
$('tfRe').addEventListener('click',play);
$('tfPause').addEventListener('click',function(){$(CFG.ids.pause).click();setTimeout(updFloat,30);});

/* ---- 輸入 ---- */
$('tsPlay').addEventListener('click',play);
$('tsAll').addEventListener('click',toggleAll);
$('tsFrom').addEventListener('click',playFrom);
$('tsPrev').addEventListener('click',function(){go(idx-1);});
$('tsNext').addEventListener('click',function(){go(idx+1);});
document.addEventListener('keydown',function(e){
  var t=e.target&&e.target.tagName;if(t==='INPUT'||t==='SELECT'||e.ctrlKey||e.metaKey||e.altKey){return;}
  if(e.key==='ArrowLeft'){go(idx-1);}else if(e.key==='ArrowRight'){go(idx+1);}
  else if(e.key==='Escape'&&openP){setOpen(false);}
});
/* 腳本或全部播放進行中,您親手操作電路(選擇開關、ON 鈕、送電/OL/重設鈕、秒數欄,或 a s d f 鍵)就停止,避免腳本把您的操作蓋掉。
   暫停鈕、聲音鈕、電流路徑、步驟區與浮球都不會中斷腳本。 */
var TAKE=CFG.take;
function userTook(e){
  if(!e.isTrusted||!(running||allOn)||frozen()){return;}
  if(e.type==='pointerdown'){var t=e.target;if(!(t&&t.closest&&t.closest(TAKE))){return;}}
  else{var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||e.ctrlKey||e.metaKey||e.altKey){return;}}
  stopRun();stopAll();runMsg='已停止(改由您手動操作)';showRun();
}
document.addEventListener('pointerdown',userTook,true);
document.addEventListener('keydown',function(e){if(CFG.keys.indexOf((e.key||'').toLowerCase())>=0){userTook(e);}},true);
setInterval(function(){if(curKey()!==key){stopRun();stopAll();runMsg='';build();}else{apply();}showRun();},400);
build();updAll();
new MutationObserver(showRun).observe(document.body,{attributes:true,attributeFilter:['class']});
})();
</script>
<script id="collapseJs">
/* 每張卡片右上角加收合鈕;沒有標題的卡片自動補標題 */
(function(){
  'use strict';
  function init(card){
    if(card.querySelector(':scope > .cbtn')){return;}
    var h=card.querySelector(':scope > h2, :scope > h3');
    if(!h){
      h=document.createElement('h2');h.className='xh';
      h.textContent=card.getAttribute('aria-label')||(card.classList.contains('controls')?'操作':'控制電路');
      card.insertBefore(h,card.firstChild);
    }
    var name=(h.textContent||'').replace(/【.*?】/g,'').trim()||'此區塊';
    var b=document.createElement('button');
    b.type='button';b.className='cbtn';
    b.innerHTML='<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path d="M3.5 6h11L9 13z" fill="currentColor"/></svg>';
    function sync(){
      var c=card.classList.contains('collapsed');
      b.setAttribute('aria-expanded',c?'false':'true');
      b.setAttribute('aria-label',(c?'展開':'收合')+'「'+name+'」');
      b.title=(c?'展開':'收合')+name;
    }
    function toggle(){card.classList.toggle('collapsed');sync();}
    b.addEventListener('click',toggle);
    /* 空白鍵在鈕上用來收合,不要觸發頁面的暫停 */
    b.addEventListener('keydown',function(e){if(e.key===' '){e.preventDefault();e.stopPropagation();if(!e.repeat){toggle();}}});
    b.addEventListener('keyup',function(e){if(e.key===' '){e.preventDefault();e.stopPropagation();}});
    h.addEventListener('click',toggle);
    card.classList.add('collapsible');
    card.appendChild(b);sync();
  }
  function all(){Array.prototype.forEach.call(document.querySelectorAll('.card'),init);}
  all();
})();
</script>
